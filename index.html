<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- Mengunci ukuran layar HP agar pas, proporsional, dan tidak rusak saat mengetik -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K7N STORE PRO</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;-webkit-tap-highlight-color:transparent}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white;position:relative}
.logout-btn{position:absolute;right:15px;top:12px;background:#ef4444;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold;border:none;color:white;cursor:pointer}
.container{padding:15px}

.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}

/* Ukuran input minimal 16px agar browser Android tidak melakukan pembesaran (auto-zoom) otomatis */
input,select{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white;font-size:16px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;font-size:16px;font-weight:bold}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer;font-weight:bold}

.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
.login-screen{display:flex;justify-content:center;align-items:center;height:70vh}

/* Gaya Grafik CSS Ringan Anda */
.bar-container {background:#334155;border-radius:8px;height:20px;width:100%;margin-top:8px;overflow:hidden}
.bar-fill {background:#4f46e5;height:100%;width:0%;transition:width 0.5s ease-in-out}
</style>
</head>

<body>

<div id="header-area" class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
const app = document.getElementById("app");
const headerArea = document.getElementById("header-area");

// Memori internal super cepat langsung dari penyimpanan lokal HP/PC
let db = JSON.parse(localStorage.getItem("k7n_store_db")) || [];
let currentAdmin = localStorage.getItem("k7n_admin_logged") || "";

const WEBHOOK_STRUK = "https://discord.com";

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

function saveDB() {
  localStorage.setItem("k7n_store_db", JSON.stringify(db));
}

/* ================= VALIDASI AKSES MASUK ================= */
function checkAuth() {
  if (!currentAdmin) {
    tampilkanHalamanLogin();
  } else {
    headerArea.innerHTML = `K7N STORE <button class="logout-btn" onclick="prosesLogout()">Keluar</button>`;
    dashboard();
  }
}

function tampilkanHalamanLogin() {
  headerArea.innerHTML = `K7N STORE - LOGIN`;
  app.innerHTML = `
    <div class="login-screen">
      <div class="card" style="width:100%; max-width:320px;">
        <h3 style="text-align:center; margin-top:0;">Akses Masuk Admin</h3>
        <p style="font-size:12px; color:#94a3b8; text-align:center;">Masukkan kode login yang didapatkan dari halaman NVRZ.</p>
        <input id="tokenInput" placeholder="Masukkan Kode Login (K7N-...)">
        <button onclick="prosesLogin()" style="margin-top:10px;">Masuk Ke Web</button>
      </div>
    </div>
  `;
}

function prosesLogin() {
  const token = document.getElementById("tokenInput").value.trim();
  if(!token.startsWith("K7N-")) return alert("Kode Login Tidak Valid!");

  try {
    const base64Part = token.replace("K7N-", "");
    const decoded = atob(base64Part); 
    const parts = decoded.split("||");
    
    if(parts.length === 2 && parts[0] !== "") {
      currentAdmin = parts[0]; 
      localStorage.setItem("k7n_admin_logged", currentAdmin);
      checkAuth();
    } else {
      alert("Kode akses salah atau rusak!");
    }
  } catch(e) {
    alert("Gagal membaca kode login!");
  }
}

function prosesLogout() {
  if(confirm("Keluar dari akun admin?")) {
    localStorage.removeItem("k7n_admin_logged");
    currentAdmin = "";
    checkAuth();
  }
}

/* ================= DASHBOARD UTAMA ================= */
function dashboard(){
  let total=0;
  db.forEach(x=>{
    if(x.status === "SUKSES") total += Number(x.harga);
  });

  app.innerHTML=`
    <div class="card">
      <h3>Selamat Datang, <span style="color:#a5b4fc;">\${currentAdmin}</span> 👋</h3>
      <p>💰 Total Omset: <b>\${formatRp(total)}</b></p>
      <p>📦 Total Penjualan: <b>\${db.length} transaksi</b></p>
    </div>

    <div class="menu">
      <div onclick="form()">📦 Buat</div>
      <div onclick="riwayat()">📊 Riwayat</div>
      <div onclick="grafik()">📈 Grafik</div>
    </div>
  `;
}

/* ================= PEMBUATAN NOTA TRANSAKSI ================= */
function form(){
  app.innerHTML=`
    <div class="card">
      <button onclick="dashboard()" style="background:#334155; margin-bottom:10px;">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama Pelanggan" autocomplete="off">
      <input id="produk" placeholder="Produk" autocomplete="off">
      <input id="harga" type="number" placeholder="Harga" inputmode="numeric">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button onclick="buat()">Simpan Transaksi</button>
      <div id="hasil"></div>
    </div>
  `;
}

window.buat=function(){
  const nm = document.getElementById("nama").value.trim();
  const pr = document.getElementById("produk").value.trim();
  const hg = document.getElementById("harga").value.trim();
  const st = document.getElementById("status").value;

  if(!nm || !pr || !hg) return alert("Semua data wajib diisi!");

  let obj={
    id: "K7N-" + Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: nm,
    produk: pr,
    harga: Number(hg),
    status: st,
    admin: currentAdmin, 
    tanggal: new Date().toISOString()
  };

  db.push(obj);
  saveDB();
  sendStruk(obj);

  document.getElementById("hasil").innerHTML=`
    <div class="struk">
      <b>STRUK BERHASIL</b><br><br>
      ID: \${obj.id}<br>
      Admin Kasir: \${obj.admin}<br>
      Pelanggan: \${obj.nama}<br>
      Produk: \${obj.produk}<br>
      Harga: \${formatRp(obj.harga)}<br>
      Status: \${obj.status}
    </div>
  `;

  // Reset kolom agar siap digunakan kembali
  document.getElementById("nama").value = "";
  document.getElementById("produk").value = "";
  document.getElementById("harga").value = "";
}

/* ================= KIRIM NOTA DISCORD ================= */
async function sendStruk(x){
  try {
    await fetch(WEBHOOK_STRUK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        embeds:[{
          title:"🧾 STRUK TRANSAKSI K7N STORE",
          color:5763719,
          fields:[
            {name:"ID NOTA", value:x.id, inline:true},
            {name:"admin", value: "admin:" + x.admin, inline:true}, 
            {name:"Pelanggan", value:x.nama, inline:true},
            {name:"Produk", value:x.produk, inline:true},
            {name:"Harga", value:formatRp(x.harga), inline:true},
            {name:"Status", value:x.status, inline:true},
            {name:"Waktu", value:new Date(x.tanggal).toLocaleString("id-ID"), inline:false}
          ],
          footer:{text:"K7N STORE SYSTEM MOBILE"}
        }]
      })
    });
  } catch(e) {}
}

/* ================= RIWAYAT PENJUALAN ================= */
function riwayat(){
  let html=`<button onclick="dashboard()" style="background:#334155; margin-bottom:10px;">⬅ Kembali</button><h3>Riwayat Transaksi</h3>`;

  if(db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada riwayat transaksi.</p>`;
  } else {
    db.map((x, idx) => ({ ...x, originalIndex: idx }))
      .reverse()
      .forEach((x)=>{
        html+=`
          <div class="card">
            <b>ID: \${x.id}</b><br>
            Oleh Admin: <b>\${x.admin}</b><br>
            Pelanggan: \({x.nama} -\){x.produk}<br>
            Harga: \${formatRp(x.harga)}<br>
            Status: <b>\${x.status}</b><br><br>
            <button onclick="edit(\${x.originalIndex})" style="width:auto; padding:5px 15px; background:#3b82f6;">Edit</button>
            <button onclick="hapus(\${x.originalIndex})" style="width:auto; padding:5px 15px; background:#ef4444;">Hapus</button>
          </div>
        `;
      });
  }
  app.innerHTML=html;
}

window.edit=function(i){
  let x=db[i];
  let nama=prompt("Nama Pelanggan:", x.nama);
  let produk=prompt("Produk:", x.produk);
  let harga=prompt("Harga:", x.harga);
  let status=prompt("Status (SUKSES/PENDING/PROSES/GAGAL):", x.status);

  if(nama && produk && harga && status) {
    db[i]={...x, nama: nama.trim(), produk: produk.trim(), harga: Number(harga), status: status.toUpperCase().trim()};
    saveDB();
    riwayat();
  }
}

window.hapus=function(i){
  if(confirm("Hapus transaksi ini secara permanen?")) {
    db.splice(i,1);
    saveDB();
    riwayat();
  }
}

/* ================= GRAFIK PERSENTASE CSS RINGAN ================= */
function grafik(){
  let totalSukses = 0;
  let totalGagal = 0;
  let totalPending = 0;
  
  db.forEach(x => {
    if(x.status === "SUKSES") totalSukses++;
    else if(x.status === "GAGAL") totalGagal++;
    else totalPending++;
  });
  
  let totalSemua = db.length || 1;
  let persenSukses = Math.round((totalSukses / totalSemua) * 100);
  let persenPending = Math.round((totalPending / totalSemua) * 100);
  let persenGagal = Math.round((totalGagal / totalSemua) * 100);

  app.innerHTML = `
    <div class="card">
      <button onclick="dashboard()" style="background:#334155; margin-bottom:10px;">⬅ Kembali</button>
      <h3>Persentase Status Nota</h3>
      
      <p>✅ SUKSES (\${totalSukses} Nota)</p>
