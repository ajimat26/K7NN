<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
padding:15px;
text-align:center;
background:linear-gradient(90deg,#4f46e5,#06b6d4);
font-weight:bold;
}

.container{padding:15px;}

.card{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#0b1220;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:8px;
background:#22d3ee;
color:black;
font-weight:bold;
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.menu div{
background:#1e293b;
padding:15px;
text-align:center;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
/* ================= SAFETY INIT ================= */
let app=document.getElementById("app");

/* kalau error pun tetap tampil */
let db=JSON.parse(localStorage.getItem("k7n"))||[];

/* save */
function save(){
localStorage.setItem("k7n",JSON.stringify(db));
}

/* format rupiah */
function rp(x){
return "Rp "+Number(x||0).toLocaleString("id-ID");
}

/* ================= RENDER ================= */
function page(p){

/* DASHBOARD */
if(p==="dashboard"){

let total=0;
db.forEach(x=>{
if(x.status==="SUKSES") total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rp(total)}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
</div>
`;
}

/* ================= BUAT ================= */
if(p==="buat"){

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>

<h3>Buat Struk</h3>

<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Produk">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Simpan</button>

<div id="hasil"></div>
</div>
`;
}

/* ================= CREATE ================= */
window.buat=function(){

let nama=document.getElementById("nama").value;
let produk=document.getElementById("produk").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

if(!nama||!produk||!harga){
alert("Isi lengkap!");
return;
}

let obj={
id:"K7N-"+Math.random().toString(36).slice(2,7),
nama,produk,harga,status,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

document.getElementById("hasil").innerHTML=`
<div class="card" style="background:white;color:black">
<b>STRUK BERHASIL</b><br><br>
ID: ${obj.id}<br>
Nama: ${obj.nama}<br>
Produk: ${obj.produk}<br>
Harga: ${rp(obj.harga)}<br>
Status: ${obj.status}
</div>
`;

}

/* ================= RIWAYAT ================= */
if(p==="riwayat"){

let html=`<button onclick="page('dashboard')">⬅</button>`;

db.forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
${rp(x.harga)}<br>
${x.status}<br>
<button onclick="hapus(${i})">Hapus</button>
</div>
`;
});

app.innerHTML=html;
}

/* delete */
window.hapus=function(i){
db.splice(i,1);
save();
page("riwayat");
}

/* ================= GRAFIK ASCII ================= */
if(p==="grafik"){

let map={};
let total=0;
let jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

let keys=Object.keys(map);
let values=Object.values(map);

let max=Math.max(...values,1);
let height=5;

let out="📊 GRAFIK K7N STORE\n\n";

for(let i=height;i>=1;i--){
let line="";
values.forEach(v=>{
let level=Math.round((v/max)*height);
line+= level>=i ? " ███ " : "    ";
});
out+=line+"\n";
}

out+="──────────────\n";
out+=keys.join(" ")+"\n";
out+=values.map(v=>"("+Math.round(v/1000)+"k)").join(" ");

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅</button>
<pre>${out}</pre>
</div>
`;
}

/* ================= INIT SAFE ================= */
window.page=page;
page("dashboard");

</script>

</body>
</html>
