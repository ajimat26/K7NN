<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO AUTO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:15px;text-align:center;background:linear-gradient(90deg,#4f46e5,#06b6d4);font-weight:bold}
.content{padding:20px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#020617;color:white}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px;background:#4f46e5;color:white}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
.struk{background:white;color:black;padding:15px;border-radius:10px;font-family:monospace}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="content" id="app"></div>

<script>

let app=document.getElementById("app");
let db=JSON.parse(localStorage.getItem("k7n"))||[];

function save(){localStorage.setItem("k7n",JSON.stringify(db));}
function rp(x){return "Rp "+Number(x).toLocaleString("id-ID");}

/* ================= WEBHOOK ================= */
const WEBHOOK_STRUK="PASTE_WEBHOOK_STRUK";
const WEBHOOK_GRAFIK="PASTE_WEBHOOK_GRAFIK";

/* ================= STRUK DISCORD ================= */
async function kirimStruk(d){
fetch(WEBHOOK_STRUK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
embeds:[{
title:"🧾 STRUK BARU",
fields:[
{name:"ID",value:d.id},
{name:"Nama",value:d.nama},
{name:"Produk",value:d.produk},
{name:"Harga",value:rp(d.harga)},
{name:"Status",value:d.status}
]
}]
})
});
}

/* ================= GRAFIK UPLOAD FIX ================= */
async function kirimGrafikFile(blob,total,jumlah){

let form=new FormData();
form.append("file",blob,"grafik.png");
form.append("payload_json",JSON.stringify({
username:"K7N STORE BOT",
content:`📊 AUTO REPORT
💰 Total: ${rp(total)}
📦 ${jumlah} transaksi`
}));

fetch(WEBHOOK_GRAFIK,{
method:"POST",
body:form
});
}

/* ================= PAGE ================= */
function page(p){

if(p==="dashboard"){
let total=0;
db.forEach(x=>{if(x.status==="SUKSES")total+=Number(x.harga)});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rp(total)}</p>
<p>📦 ${db.length}</p>
</div>

<div class="menu">
<div onclick="page('buat')">Buat</div>
<div onclick="page('riwayat')">Riwayat</div>
<div onclick="page('grafik')">Grafik</div>
<div onclick="toggleAuto()">Auto: ${auto?"ON":"OFF"}</div>
</div>
`;
}

/* ================= BUAT ================= */
if(p==="buat"){
app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>

<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Produk">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat Struk</button>
<div id="hasil"></div>
</div>
`;
}

/* ================= BUAT STRUK ================= */
window.buat=function(){

let nama=document.getElementById("nama").value;
let produk=document.getElementById("produk").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

if(!nama||!produk||!harga)return alert("Isi semua!");

let obj={
id:"K7N-"+Math.random().toString(36).substr(2,6),
nama,produk,
harga:Number(harga),
status,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

kirimStruk(obj);

document.getElementById("hasil").innerHTML=`
<div class="struk" id="strukBox">
<h3>K7N STORE</h3>
<p>ID:${obj.id}</p>
<p>${obj.nama}</p>
<p>${obj.produk}</p>
<p>${rp(obj.harga)}</p>
<p>${obj.status}</p>
</div>

<button onclick="download()">Download</button>
`;
};

/* ================= DOWNLOAD ================= */
window.download=function(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
};

/* ================= GRAFIK ================= */
if(p==="grafik"){

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅</button>
<h3>Grafik + Auto 1 Jam</h3>

<button onclick="sendGrafik()">Kirim Manual</button>
</div>

<canvas id="chart"></canvas>
`;

let map={}, total=0, jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

setTimeout(()=>{
new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),tension:0.3}]
}
});
},200);

/* MANUAL SEND */
window.sendGrafik=function(){

html2canvas(document.getElementById("chart")).then(canvas=>{
canvas.toBlob(blob=>{
kirimGrafikFile(blob,total,jumlah);
});
});
};

}

/* ================= AUTO GRAFIK 1 JAM ================= */
let auto=false;

window.toggleAuto=function(){
auto=!auto;
alert("Auto Grafik: "+(auto?"ON":"OFF"));
}

/* loop 1 jam */
setInterval(()=>{

if(!auto) return;

let map={}, total=0, jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
map[x.tanggal]=1;
total+=Number(x.harga);
jumlah++;
}
});

html2canvas(document.getElementById("app")||document.body).then(canvas=>{
canvas.toBlob(blob=>{
kirimGrafikFile(blob,total,jumlah);
});
});

},3600000); // 1 JAM

}

/* START */
window.page=page;
page("dashboard");

</script>

</body>
</html>
