<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;}
.header{padding:15px;text-align:center;background:linear-gradient(90deg,#4f46e5,#06b6d4);color:white;font-weight:bold;}
.container{padding:15px;}

.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px;}

input,select{
width:100%;padding:10px;margin:5px 0;
border:none;border-radius:8px;background:#0f172a;color:white;
}

button{
width:100%;padding:10px;margin-top:5px;
border:none;border-radius:8px;background:#22d3ee;color:black;font-weight:bold;
}

.menu{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}

.menu div{
background:#1e293b;padding:15px;text-align:center;
border-radius:10px;cursor:pointer;
}

.struk{
background:white;color:black;padding:10px;border-radius:10px;
font-family:monospace;
}

.line{border-bottom:1px dashed #aaa;margin:8px 0;}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
let app=document.getElementById("app");

let db=JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK_STRUK="WEBHOOK_STRUK_KAMU";
const WEBHOOK_GRAFIK="WEBHOOK_GRAFIK_KAMU";

function save(){
localStorage.setItem("k7n",JSON.stringify(db));
}

function rp(x){
return "Rp "+Number(x).toLocaleString("id-ID");
}

/* ================= DASHBOARD ================= */
function page(p){

if(p=="dashboard"){

let total=0;
db.forEach(x=>{
if(x.status==="SUKSES") total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rp(total)}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat Struk</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
</div>
`;
}

/* ================= BUAT STRUK ================= */
if(p=="buat"){

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>

<h3>Buat Struk</h3>

<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Nama Produk">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat Struk</button>

<div id="hasil"></div>
</div>
`;
}

/* ================= BUAT ================= */
window.buat=function(){

let nama=namaInput("nama");
let produk=namaInput("produk");
let harga=namaInput("harga");
let status=document.getElementById("status").value;

if(!nama||!produk||!harga)return alert("Isi lengkap!");

let id="K7N-"+Math.random().toString(36).substr(2,5);
let t=new Date().toISOString();

let obj={id,nama,produk,harga,status,tanggal:t};

db.push(obj);
save();

/* STRUK */
document.getElementById("hasil").innerHTML=`
<div class="struk" id="strukBox">
<h3>K7N STORE</h3>
<div class="line"></div>

ID: ${id}<br>
Nama: ${nama}<br>
Produk: ${produk}<br>

<div class="line"></div>

Harga: ${rp(harga)}<br>
Status: ${status}
</div>

<button onclick="kirimStruk(${db.length-1})">Kirim ke Discord</button>
`;

}

/* ================= KIRIM STRUK ================= */
async function kirimStruk(i){

let x=db[i];

await fetch(WEBHOOK_STRUK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
content:`🧾 STRUK BARU`,
embeds:[{
title:"STRUK TRANSAKSI",
fields:[
{name:"ID",value:x.id},
{name:"Nama",value:x.nama},
{name:"Produk",value:x.produk},
{name:"Harga",value:rp(x.harga)},
{name:"Status",value:x.status}
]
}]
})
});

}

/* ================= RIWAYAT ================= */
if(p=="riwayat"){

let html=`<button onclick="page('dashboard')">⬅</button>`;

db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
${rp(x.harga)}<br>
${x.status}<br>

<button onclick="hapus(${i})">Hapus</button>
</div>
`;
});

app.innerHTML=html;
}

window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);
save();
page("riwayat");
}
}

/* ================= GRAFIK ASCII ================= */
if(p=="grafik"){

let map={}, total=0,jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

let keys=Object.keys(map);
let values=Object.values(map);
let max=Math.max(...values);

let height=5;

let msg="📊 LAPORAN GRAFIK K7N STORE\n━━━━━━━━━━━━━━━━━━\n\n";
msg+=`💰 TOTAL: ${rp(total)}\n`;
msg+=`📦 TRANSAKSI: ${jumlah}\n\n`;
msg+=`📈 PER HARI:\n\n`;

/* BAR VERTICAL */
for(let i=height;i>=1;i--){
let line="";
values.forEach(v=>{
let level=Math.round((v/max)*height);
line+= level>=i ? "   ███  " : "       ";
});
msg+=line+"\n";
}

msg+="──────────────\n";
msg+=keys.map(k=>k.slice(0,5)).join("  ")+"\n\n";
msg+=values.map(v=>"("+Math.round(v/1000)+"k)").join("   ");

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅</button>
<pre>${msg}</pre>
<button onclick="kirimGrafik()">Kirim Grafik Discord</button>
</div>
`;
}

/* ================= KIRIM GRAFIK ================= */
window.kirimGrafik=function(){

let map={}, total=0,jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

let keys=Object.keys(map);
let values=Object.values(map);
let max=Math.max(...values);
let height=5;

let msg="📊 LAPORAN GRAFIK K7N STORE\n━━━━━━━━━━━━━━━━━━\n\n";
msg+=`💰 TOTAL: ${rp(total)}\n`;
msg+=`📦 TRANSAKSI: ${jumlah}\n\n`;
msg+=`📈 PER HARI:\n\n`;

for(let i=height;i>=1;i--){
let line="";
values.forEach(v=>{
let level=Math.round((v/max)*height);
line+= level>=i ? "   ███  " : "       ";
});
msg+=line+"\n";
}

msg+="──────────────\n";
msg+=keys.map(k=>k.slice(0,5)).join("  ")+"\n\n";
msg+=values.map(v=>"("+Math.round(v/1000)+"k)").join("   ");

fetch(WEBHOOK_GRAFIK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
content:msg
})
});

}

/* ================= HELP ================= */
function namaInput(id){
return document.getElementById(id).value.trim();
}

window.page=page;
page("dashboard");

</script>

</body>
</html>
