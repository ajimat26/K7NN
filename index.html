<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

/* ===== ROOT ===== */
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
--accent:#22d3ee;
}

/* ===== BODY ===== */
body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

/* ===== HEADER ===== */
.header{
background:linear-gradient(90deg,#4f46e5,#06b6d4);
color:white;
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

/* ===== LAYOUT ===== */
.container{
display:flex;
flex-direction:column;
height:100vh;
}
.content{
flex:1;
padding:20px;
overflow:auto;
}

/* ===== CARD ===== */
.card{
background:var(--card);
padding:15px;
border-radius:15px;
margin-bottom:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
}

/* ===== INPUT ===== */
input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
background:#0f172a;
color:white;
outline:none;
}

input:focus,select:focus{
box-shadow:0 0 10px var(--accent);
}

/* ===== BUTTON ===== */
button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#4f46e5,#06b6d4);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
opacity:0.9;
transform:scale(1.03);
}

button:active{
transform:scale(0.95);
box-shadow:0 0 15px var(--accent);
}

/* ===== MENU DASHBOARD ===== */
.menu-center{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.menu-card{
position:relative;
padding:20px;
background:var(--card);
border-radius:15px;
text-align:center;
font-weight:bold;
cursor:pointer;
overflow:hidden;
transition:0.3s;
border:1px solid rgba(255,255,255,0.05);
}

/* NEON LINE */
.menu-card::before{
content:"";
position:absolute;
inset:-2px;
border-radius:15px;
background:linear-gradient(90deg,transparent,var(--accent),transparent);
background-size:300% 300%;
animation:jalan 3s linear infinite;
z-index:0;
}

.menu-card::after{
content:"";
position:absolute;
inset:2px;
background:var(--card);
border-radius:13px;
z-index:1;
}

.menu-card span{
position:relative;
z-index:2;
}

.menu-card:hover{
transform:translateY(-5px);
box-shadow:0 0 20px var(--accent);
}

.menu-card:active{
transform:scale(0.95);
box-shadow:0 0 25px var(--accent);
}

/* ===== STRUK ===== */
.struk{
background:white;
color:black;
padding:15px;
border-radius:12px;
margin-top:10px;
font-family:monospace;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ===== STATUS ===== */
.status{
padding:4px 8px;
border-radius:6px;
color:white;
font-size:12px;
}
.sukses{background:#22c55e;}
.pending{background:#f59e0b;}
.proses{background:#3b82f6;}
.gagal{background:#ef4444;}

/* ===== LINE ===== */
.line{
border-bottom:1px dashed #aaa;
margin:10px 0;
}

/* ===== LOGO ===== */
.logo{
width:50px;
display:block;
margin:auto;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{
width:6px;
}
::-webkit-scrollbar-thumb{
background:var(--tema);
border-radius:10px;
}

/* ===== ANIMATION ===== */
@keyframes jalan{
0%{background-position:0%;}
100%{background-position:300%;}
}

</style>
</head>

<body>

<div class="container">
<div class="header">K7N STORE</div>
<div class="content" id="app"></div>
</div>

<script>

/* LOAD TEMA */
let t = localStorage.getItem("tema");
let bg = localStorage.getItem("bg");

if(t) document.documentElement.style.setProperty('--tema', t);
if(bg) document.documentElement.style.setProperty('--bg', bg);

/* DATABASE */
let db = JSON.parse(localStorage.getItem("k7n")) || [];

/* PRODUK */
const produk = [
{nama:"Follower Indo 100", harga:10500},
{nama:"Follower Global 100", harga:5000},
{nama:"Like TikTok 100", harga:800},
{nama:"Viewer 1000", harga:800}
];

const logo="https://i.supaimg.com/2c1011f1-f260-4955-af4a-29c7a57d78c9.png";

/* PAGE */
function page(p){

if(p=="dashboard"){
let total=0;
db.forEach(x=>{if(x.status==="SUKSES")total+=Number(x.harga);});

app.innerHTML=`
<div class="card">
<h3>📊 Dashboard</h3>
<p>💰 Rp ${total.toLocaleString("id-ID")}</p>
<p>📦 ${db.length} Transaksi</p>
</div>

<div class="menu-center">
<div class="menu-card" onclick="page('buat')"><span>📦 Buat</span></div>
<div class="menu-card" onclick="page('riwayat')"><span>📊 Riwayat</span></div>
<div class="menu-card" onclick="page('grafik')"><span>📈 Grafik</span></div>
<div class="menu-card" onclick="page('setting')"><span>⚙️ Setting</span></div>
</div>
`;
}

/* BUAT */
if(p=="buat"){
let opt="";
produk.forEach((x,i)=>{
opt+=`<option value="${i}">${x.nama} - Rp ${x.harga}</option>`;
});

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>
<h3>Buat Struk</h3>

<input id="nama" placeholder="Nama">

<select id="produk" onchange="isiHarga()">
<option value="">Pilih Produk</option>
${opt}
<option value="custom">Custom</option>
</select>

<input id="harga" type="number" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat Struk</button>

<div id="hasil"></div>
</div>
`;
}

/* RIWAYAT */
if(p=="riwayat"){
let html=`<button onclick="page('dashboard')">⬅️ Kembali</button>`;
db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama}<br>
${x.layanan}<br>
Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
<span class="status ${x.status.toLowerCase()}">${x.status}</span>

<button onclick="editData(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});
app.innerHTML=html;
}

/* GRAFIK */
if(p=="grafik"){
let map={};
db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});

app.innerHTML=`
<button onclick="page('dashboard')">⬅️ Kembali</button>
<div class="card"><canvas id="c"></canvas></div>
`;

setTimeout(()=>{
new Chart(c,{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),tension:0.3}]
}
});
},100);
}

/* SETTING */
if(p=="setting"){
let tema=localStorage.getItem("tema")||"#4f46e5";
let bg=localStorage.getItem("bg")||"#0f172a";

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>

<h3>Pengaturan</h3>

<label>Warna Tema</label>
<input type="color" id="color" value="${tema}">

<label>Warna Background</label>
<input type="color" id="bgcolor" value="${bg}">

<button onclick="simpanTema()">Simpan</button>
</div>
`;
}

}

/* AUTO HARGA */
function isiHarga(){
let v=document.getElementById("produk").value;
if(v!=="custom" && v!==""){
document.getElementById("harga").value=produk[v].harga;
}
}

/* BUAT */
function buat(){
let nama=document.getElementById("nama").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;
let p=document.getElementById("produk").value;

if(!nama||!harga)return alert("Isi dulu!");

let namaProduk=(p==="custom"||p==="")?"Custom":produk[p].nama;
let id="K7N-"+Math.random().toString(36).substr(2,5);
let tanggal=new Date().toISOString();

let obj={id,nama,layanan:namaProduk,harga,status,tanggal};
db.push(obj);
localStorage.setItem("k7n",JSON.stringify(db));

hasil.innerHTML=`
<div id="strukBox" class="struk">
<img src="${logo}" class="logo">
<h3 style="text-align:center;">K7N STORE</h3>
<div class="line"></div>
<p>ID: ${id}</p>
<p>Nama: ${nama}</p>
<p>Layanan: ${namaProduk}</p>
<div class="line"></div>
<p>Harga: Rp ${Number(harga).toLocaleString("id-ID")}</p>
<div class="line"></div>
<p>Status: <span class="status ${status.toLowerCase()}">${status}</span></p>
</div>

<button onclick="download()">Download</button>
<button onclick='wa(${JSON.stringify(obj)})'>WhatsApp</button>
`;
}

/* EDIT */
function editData(i){
let x=db[i];
let nama=prompt("Nama:",x.nama);
let harga=prompt("Harga:",x.harga);
let status=prompt("Status:",x.status);
if(!nama||!harga||!status)return;
db[i].nama=nama;
db[i].harga=harga;
db[i].status=status;
localStorage.setItem("k7n",JSON.stringify(db));
page("riwayat");
}

/* HAPUS */
function hapus(i){
if(confirm("Hapus?")){
db.splice(i,1);
localStorage.setItem("k7n",JSON.stringify(db));
page("riwayat");
}
}

/* DOWNLOAD */
function download(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
function wa(x){
let t=`ID:${x.id}\nNama:${x.nama}\nHarga:${x.harga}`;
window.open("https://wa.me/?text="+encodeURIComponent(t));
}

/* SIMPAN TEMA */
function simpanTema(){
let warna=document.getElementById("color").value;
let bg=document.getElementById("bgcolor").value;

localStorage.setItem("tema",warna);
localStorage.setItem("bg",bg);

document.documentElement.style.setProperty('--tema',warna);
document.documentElement.style.setProperty('--bg
