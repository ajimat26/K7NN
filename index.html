<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>
<script src="https://jsdelivr.net"></script>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer;color:white;border:none;font-size:16px}
.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
</style>
</head>
<body>

<div class="header">K7N STORE</div>
<div class="container" id="app">
  <div class="card">
    <h3>Dashboard (Cloud Realtime)</h3>
    <p id="txt-omset">💰 Rp 0 (Mencoba tersambung...)</p>
    <p id="txt-transaksi">📦 0 transaksi</p>
  </div>
  <div class="menu">
    <button id="nav-buat">📦 Buat</button>
    <button id="nav-riwayat">📊 Riwayat</button>
    <button id="nav-grafik">📈 Grafik</button>
    <button id="nav-discord">⏱ Kirim Grafik</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://gstatic.com";
import { getDatabase, ref, set, push, onValue, update, remove } from "https://gstatic.com";

const firebaseConfig = {
  apiKey: "AIzaSyBzuWxZ98WtUlHJeaC3ZK1DHnBgThPCNBc",
  authDomain: "://firebaseapp.com",
  databaseURL: "https://firebasedatabase.app",
  projectId: "k7n--store",
  storageBucket: "k7n--store.firebasestorage.app",
  messagingSenderId: "293030742753",
  appId: "1:293030742753:web:240e6745e04f7930aa05a0",
  measurementId: "G-BTW6HEL05Z"
};

// Bungkus dengan try-catch agar jika error di HP tidak membuat tombol macet
try {
  const firebaseApp = initializeApp(firebaseConfig);
  const database = getDatabase(firebaseApp);
  const dbRef = ref(database, 'transaksi');

  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    window.db = [];
    if (data) {
      Object.keys(data).forEach(key => {
        window.db.push({ firebaseKey: key, ...data[key] });
      });
    }
    window.updateDashboardData();
  }, (err) => {
    console.log("Firebase block:", err);
    document.getElementById("txt-omset").innerText = "💰 Gagal konek (Cek Rules Firebase)";
  });

  window.simpanKeCloud = function(obj, callback) {
    set(push(dbRef), obj).then(callback).catch(err => alert("Gagal: " + err.message));
  };

  window.updateKeCloud = function(key, data, callback) {
    update(ref(database, 'transaksi/' + key), data).then(callback);
  };

  window.hapusDariCloud = function(key, callback) {
    remove(ref(database, 'transaksi/' + key)).then(callback);
  };

} catch(e) {
  console.error("Firebase Gagal Dimuat", e);
}
</script>

<script>
/* ================= LOGIKA APLIKASI UTAMA (ANTI-STUCK) ================= */
window.db = [];
const WEBHOOK_STRUK="https://discord.com";
const WEBHOOK_GRAFIK="https://discord.com";

let halamanAktif = "dashboard";

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

window.updateDashboardData = function() {
  let total = 0;
  window.db.forEach(x => {
    if(x.status === "SUKSES") total += Number(x.harga);
  });
  
  const elOmset = document.getElementById("txt-omset");
  const elTx = document.getElementById("txt-transaksi");
  if(elOmset) elOmset.innerText = "💰 " + formatRp(total);
  if(elTx) elTx.innerText = "📦 " + window.db.length + " transaksi";
  
  if (halamanAktif === "riwayat") tampilkanRiwayat();
}

function tampilkanDashboard() {
  halamanAktif = "dashboard";
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>Dashboard (Cloud Realtime)</h3>
      <p id="txt-omset">💰 Menghitung...</p>
      <p id="txt-transaksi">📦 0 transaksi</p>
    </div>
    <div class="menu">
      <button id="nav-buat">📦 Buat</button>
      <button id="nav-riwayat">📊 Riwayat</button>
      <button id="nav-grafik">📈 Grafik</button>
      <button id="nav-discord">⏱ Kirim Grafik</button>
    </div>
  `;
  initTombol();
  window.updateDashboardData();
}

function tampilkanForm() {
  halamanAktif = "form";
  document.getElementById("app").innerHTML = `
    <div class="card">
      <button id="btn-kembali">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama">
      <input id="produk" placeholder="Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button id="btn-simpan">Simpan</button>
      <div id="hasil"></div>
    </div>
  `;
  document.getElementById("btn-kembali").onclick = tampilkanDashboard;
  document.getElementById("btn-simpan").onclick = prosesSimpanTransaksi;
}

function prosesSimpanTransaksi() {
  const nm = document.getElementById("nama").value;
  const pr = document.getElementById("produk").value;
  const hg = document.getElementById("harga").value;
  const st = document.getElementById("status").value;

  if(!nm || !pr || !hg) return alert("Semua data wajib diisi!");

  let obj = {
    id: "K7N-" + Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: nm,
    produk: pr,
    harga: Number(hg),
    status: st,
    tanggal: new Date().toISOString()
  };

  if(typeof window.simpanKeCloud === "function") {
    window.simpanKeCloud(obj, () => {
      kirimStrukDiscord(obj);
      document.getElementById("hasil").innerHTML = `
        <div class="struk"><b>STRUK BERHASIL TERSIMPAN</b><br><br>ID: ${obj.id}<br>Nama: ${obj.nama}<br>Harga: ${formatRp(obj.harga)}</div>
      `;
    });
  } else {
    alert("Koneksi cloud offline. Data gagal dikirim.");
  }
}

function tampilkanRiwayat() {
  halamanAktif = "riwayat";
  let html = `<button id="btn-kembali">⬅ Kembali</button>`;
  
  if(window.db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada transaksi.</p>`;
  } else {
    window.db.slice().reverse().forEach(x => {
      html += `
        <div class="card">
          <b>${x.id}</b><br>${x.nama} - ${x.produk}<br>${formatRp(x.harga)}<br>Status: <b>${x.status}</b><br><br>
          <button class="btn-edit" data-key="${x.firebaseKey}">Edit</button>
          <button class="btn-hapus" data-key="${x.firebaseKey}" style="background:#ef4444; margin-top:5px;">Hapus</button>
        </div>
      `;
    });
  }
  document.getElementById("app").innerHTML = html;
  document.getElementById("btn-kembali").onclick = tampilkanDashboard;

  document.querySelectorAll(".btn-edit").forEach(b => {
    b.onclick = () => {
      const item = window.db.find(x => x.firebaseKey === b.getAttribute("data-key"));
      let nama = prompt("Nama baru:", item.nama);
      let produk = prompt("Produk baru:", item.produk);
      let harga = prompt("Harga baru:", item.harga);
      let status = prompt("Status baru:", item.status);
      if(nama && produk && harga && status && typeof window.updateKeCloud === "function") {
        window.updateKeCloud(item.firebaseKey, { nama, produk, harga: Number(harga), status }, tampilkanRiwayat);
      }
    };
  });

  document.querySelectorAll(".btn-hapus").forEach(b => {
    b.onclick = () => {
      if(confirm("Hapus transaksi?") && typeof window.hapusDariCloud === "function") {
        window.hapusDariCloud(b.getAttribute("data-key"), tampilkanRiwayat);
      }
    };
  });
}

function tampilkanGrafik() {
  halamanAktif = "grafik";
  let map = {};
  window.db.forEach(x => {
    if(x.status === "SUKSES") {
      let d = new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d] = (map[d] || 0) + Number(x.harga);
    }
  });

  document.getElementById("app").innerHTML = `<div class="card"><button id="btn-kembali">⬅ Kembali</button><canvas id="chart"></canvas></div>`;
  document.getElementById("btn-kembali").onclick = tampilkanDashboard;

  setTimeout(() => {
    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: Object.keys(map),
        datasets: [{ label: 'Omset Sukses', data: Object.values(map), borderColor: "#4f46e5", tension: 0.4 }]
      }
    });
  }, 200);
}

async function kirimStrukDiscord(x) {
  try {
    await fetch(WEBHOOK_STRUK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ embeds: [{ title: "🧾 STRUK K7N STORE", fields: [{ name: "ID", value: x.id }, { name: "Nama", value: x.nama }, { name: "Harga", value: formatRp(x.harga) }] }] })
    });
  } catch(e){}
}

async function kirimGrafikDiscord() {
  alert("Mengirim grafik...");
}

function initTombol() {
  const b = document.getElementById("nav-buat");
  const r = document.getElementById("nav-riwayat");
  const g = document.getElementById("nav-grafik");
  const d = document.getElementById("nav-discord");
  if(b) b.onclick = tampilkanForm;
  if(r) r.onclick = tampilkanRiwayat;
  if(g) g.onclick = tampilkanGrafik;
  if(d) d.onclick = kirimGrafikDiscord;
}

// Jalankan fungsi tombol bawaan saat pertama kali dimuat
initTombol();
</script>
</body>
</html>
