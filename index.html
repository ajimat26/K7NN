<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO MAX FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}
.header{background:linear-gradient(90deg,#4f46e5,#06b6d4);padding:15px;text-align:center;color:white;font-weight:bold;}
.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto;}

.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:10px;}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#020617;color:white;}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px;background:var(--tema);color:white;}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.menu div{background:var(--card);padding:20px;text-align:center;border-radius:10px;cursor:pointer;}

.struk{background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;font-family:monospace;}
.line{border-bottom:1px dashed #aaa;margin:8px 0;}

.status{padding:4px;border-radius:5px;color:white;font-size:12px;}
.sukses{background:green}.pending{background:orange}.proses{background:blue}.gagal{background:red}
</style>
</head>

<body>

<div class="container">
<div class="header">K7N STORE</div>
<div class="content" id="app"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");
let db = JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK="https://discord.com/api/webhooks/1497825833295806477/9avVXxaqYpdlCiR-Rwzgsnw8FeKW218LXMUt9K5BzsxHxVn7ccty8VP7cj2K5gDcQH9V";

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

/* ===== DISCORD STRUK ===== */
async function kirimDiscord(d){
try{
await fetch(WEBHOOK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
content:"💸 Transaksi baru!",
embeds:[{
title:"STRUK BARU",
fields:[
{name:"ID",value:d.id},
{name:"Nama",value:d.nama},
{name:"Harga",value:"Rp "+d.harga},
{name:"Status",value:d.status}
]
}]
})
});
}catch(e){}
}

/* ===== DISCORD GRAFIK ===== */
async function kirimGrafik(){
try{
let map={}, total=0, jumlah=0;

db.forEach(x=>{
if(x.status=="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

let canvas=document.createElement("canvas");
canvas.width=800;
canvas.height=400;

new Chart(canvas,{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{
label:"Pendapatan",
data:Object.values(map),
borderWidth:3,
tension:0.3
}]
},
options:{animation:false}
});

await new Promise(r=>setTimeout(r,500));

const blob=await new Promise(res=>canvas.toBlob(res));

let form=new FormData();
form.append("file",blob,"grafik.png");

form.append("payload_json",JSON.stringify({
username:"K7N STORE",
content:`📊 LAPORAN OTOMATIS
🕒 ${new Date().toLocaleString("id-ID")}
💰 Total: Rp ${total.toLocaleString("id-ID")}
📦 Transaksi: ${jumlah}`
}));

await fetch(WEBHOOK,{method:"POST",body:form});
}catch(e){console.log(e);}
}

/* AUTO 1 JAM */
setInterval(()=>kirimGrafik(),3600000);

/* ===== PAGE ===== */
function page(p){

/* DASHBOARD */
if(p=="dashboard"){
let total=0;
db.forEach(x=>{if(x.status=="SUKSES")total+=Number(x.harga)});
app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 Rp ${total.toLocaleString("id-ID")}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
<div onclick="page('setting')">⚙️ Setting</div>
</div>`;
}

/* BUAT */
if(p=="buat"){
app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️</button>

<input id="nama" placeholder="Nama">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>
<div id="hasil"></div>
</div>`;
}

/* BUAT LOGIC */
window.buat=function(){
let nama=nama.value;
let harga=harga.value;
let status=status.value;

if(!nama||!harga)return alert("Isi data!");

let obj={
id:"K7N-"+Math.random().toString(36).substr(2,5),
nama,harga,status,tanggal:new Date().toISOString()
};

db.push(obj);save();
kirimDiscord(obj);

hasil.innerHTML=`
<div id="strukBox" class="struk">
<h3>K7N STORE</h3>
<div class="line"></div>
<p>ID: ${obj.id}</p>
<p>Nama: ${nama}</p>
<div class="line"></div>
<p>Harga: Rp ${Number(harga).toLocaleString("id-ID")}</p>
<div class="line"></div>
<p>Status: ${status}</p>
</div>

<button onclick="download()">Download</button>
<button onclick='wa(${JSON.stringify(obj)})'>WhatsApp</button>
`;
}

/* DOWNLOAD */
window.download=function(){
html2canvas(strukBox).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
window.wa=function(x){
let t=`ID:${x.id}\nNama:${x.nama}\nHarga:${x.harga}`;
window.open("https://wa.me/?text="+encodeURIComponent(t));
}

/* RIWAYAT */
if(p=="riwayat"){
let html=`<button onclick="page('dashboard')">⬅️</button>`;
db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama}<br>
Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
${x.status}
<button onclick="edit(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});
app.innerHTML=html;
}

/* EDIT */
window.edit=function(i){
let x=db[i];
let namaBaru=prompt("Nama",x.nama);
let hargaBaru=prompt("Harga",x.harga);
let statusBaru=prompt("Status",x.status);

if(!namaBaru||!hargaBaru||!statusBaru)return;

db[i]={...x,nama:namaBaru,harga:hargaBaru,status:statusBaru};
save();page("riwayat");
}

/* HAPUS */
window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);save();page("riwayat");
}
}

/* GRAFIK */
if(p=="grafik"){
let map={};
db.forEach(x=>{
if(x.status=="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});
app.innerHTML=`<button onclick="page('dashboard')">⬅️</button><canvas id="c"></canvas>`;
setTimeout(()=>{
new Chart(c,{
type:"line",
data:{labels:Object.keys(map),datasets:[{data:Object.values(map),tension:0.3}]}
});
},100);
}

/* SETTING */
if(p=="setting"){
let tema=localStorage.getItem("tema")||"#4f46e5";
let bg=localStorage.getItem("bg")||"#0f172a";

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️</button>

<h3>Setting</h3>

<label>Tema</label>
<input type="color" id="t" value="${tema}">

<label>Background</label>
<input type="color" id="b" value="${bg}">

<button onclick="saveTheme()">Simpan</button>
</div>`;
}

/* SAVE THEME */
window.saveTheme=function(){
let t=document.getElementById("t").value;
let b=document.getElementById("b").value;

localStorage.setItem("tema",t);
localStorage.setItem("bg",b);

document.documentElement.style.setProperty('--tema',t);
document.documentElement.style.setProperty('--bg',b);

alert("Tema disimpan!");
}

}

window.page=page;
page("dashboard");

});
</script>

</body>
</html>
