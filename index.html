<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO (CLOUD)</title>

<!-- Ambil Chart.js -->
<script src="https://jsdelivr.net"></script>

<!-- Ambil SDK Firebase (Modular v9) -->
<script type="module">
import { initializeApp } from "https://gstatic.com";
import { getDatabase, ref, set, push, onValue, update, remove } from "https://gstatic.com";

// ✅ KONFIGURASI FIREBASE CLOUD ANDA SUDAH TERPASANG
const firebaseConfig = {
  apiKey: "AIzaSyBzuWxZ98WtUlHJeaC3ZK1DHnBgThPCNBc",
  authDomain: "k7n--store.firebaseapp.com",
  databaseURL: "https://k7n--store-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "k7n--store",
  storageBucket: "k7n--store.firebasestorage.app",
  messagingSenderId: "293030742753",
  appId: "1:293030742753:web:240e6745e04f7930aa05a0",
  measurementId: "G-BTW6HEL05Z"
};

// Inisialisasi Firebase
const firebaseApp = initializeApp(firebaseConfig);
const database = getDatabase(firebaseApp);
const dbRef = ref(database, 'transaksi');

const WEBHOOK_STRUK="https://discord.com";
const WEBHOOK_GRAFIK="https://discord.com";

let db = []; 

// Mendengarkan perubahan data secara Real-Time dari Cloud
onValue(dbRef, (snapshot) => {
  const data = snapshot.val();
  db = [];
  if (data) {
    Object.keys(data).forEach(key => {
      db.push({ firebaseKey: key, ...data[key] });
    });
  }
  // Otomatis refresh halaman jika user sedang di dashboard
  if(document.getElementById("status-halaman").value === "dashboard") {
    dashboard();
  }
});

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

/* ================= DISCORD STRUK ================= */
async function sendStruk(x){
  await fetch(WEBHOOK_STRUK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      embeds:[{
        title:"🧾 STRUK TRANSAKSI K7N STORE",
        color:5763719,
        fields:[
          {name:"ID",value:x.id,inline:true},
          {name:"Nama",value:x.nama,inline:true},
          {name:"Produk",value:x.produk,inline:true},
          {name:"Harga",value:formatRp(x.harga),inline:true},
          {name:"Status",value:x.status,inline:true},
          {name:"Waktu",value:new Date(x.tanggal).toLocaleString("id-ID"),inline:false}
        ],
        footer:{text:"K7N STORE SYSTEM"}
      }]
    })
  });
}

/* ================= DISCORD GRAFIK EMBED ================= */
async function sendGrafik(){
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });

  let keys=Object.keys(map);
  let values=Object.values(map);
  let total=values.reduce((a,b)=>a+b,0);
  let lines=keys.map((k,i)=> `${k} → ${formatRp(values[i])}`).join("\n");

  await fetch(WEBHOOK_GRAFIK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      embeds:[{
        title:"📊 LAPORAN GRAFIK K7N STORE",
        color:3447003,
        description: "```"+lines+"```",
        fields:[
          {name:"TOTAL",value:formatRp(total),inline:true},
          {name:"TRANSAKSI",value:String(db.length),inline:true}
        ],
        footer:{text:"Auto Report System"}
      }]
    })
  });
}

setInterval(sendGrafik,3600000);

/* ================= NAVIGATION & VIEW ================= */
const app=document.getElementById("app");

function dashboard(){
  document.getElementById("status-halaman").value = "dashboard";
  let total=0;
  db.forEach(x=>{
    if(x.status==="SUKSES") total+=Number(x.harga);
  });

  app.innerHTML=`
    <div class="card">
      <h3>Dashboard (Cloud)</h3>
      <p>💰 ${formatRp(total)}</p>
      <p>📦 ${db.length} transaksi</p>
    </div>
    <div class="menu">
      <div id="btn-form">📦 Buat</div>
      <div id="btn-riwayat">📊 Riwayat</div>
      <div id="btn-grafik">📈 Grafik</div>
      <div id="btn-send-grafik">⏱ Kirim Grafik</div>
    </div>
  `;
  
  document.getElementById("btn-form").onclick = form;
  document.getElementById("btn-riwayat").onclick = riwayat;
  document.getElementById("btn-grafik").onclick = grafik;
  document.getElementById("btn-send-grafik").onclick = sendGrafik;
}

function form(){
  document.getElementById("status-halaman").value = "form";
  app.innerHTML=`
    <div class="card">
      <button id="btn-back">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama">
      <input id="produk" placeholder="Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button id="btn-simpan">Simpan</button>
      <div id="hasil"></div>
    </div>
  `;
  document.getElementById("btn-back").onclick = dashboard;
  document.getElementById("btn-simpan").onclick = buat;
}

function buat(){
  const namaVal = document.getElementById("nama").value;
  const produkVal = document.getElementById("produk").value;
  const hargaVal = document.getElementById("harga").value;
  const statusVal = document.getElementById("status").value;

  if(!namaVal || !produkVal || !hargaVal) return alert("Isi semua data!");

  let obj={
    id:"K7N-"+Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: namaVal,
    produk: produkVal,
    harga: Number(hargaVal),
    status: statusVal,
    tanggal:new Date().toISOString()
  };

  const newTxRef = push(dbRef);
  set(newTxRef, obj).then(() => {
    sendStruk(obj);
    document.getElementById("hasil").innerHTML=`
      <div class="struk">
        <b>STRUK BERHASIL (TERSIMPAN DI CLOUD)</b><br><br>
        ID:${obj.id}<br>
        Nama:${obj.nama}<br>
        Produk:${obj.produk}<br>
        Harga:${formatRp(obj.harga)}<br>
        Status:${obj.status}
      </div>
    `;
  });
}

function riwayat(){
  document.getElementById("status-halaman").value = "riwayat";
  let html=`<button id="btn-back-dash">⬅ Kembali</button>`;

  db.slice().reverse().forEach((x) => {
    html+=`
      <div class="card">
        <b>${x.id}</b><br>
        ${x.nama} - ${x.produk}<br>
        ${formatRp(x.harga)}<br>
        Status: <b>${x.status}</b><br><br>
        <button class="btn-edit" data-key="${x.firebaseKey}">Edit</button>
        <button class="btn-hapus" data-key="${x.firebaseKey}" style="background:#ef4444; margin-top:5px;">Hapus</button>
      </div>
    `;
  });

  app.innerHTML=html;
  document.getElementById("btn-back-dash").onclick = dashboard;

  document.querySelectorAll(".btn-edit").forEach(btn => {
    btn.onclick = () => editData(btn.getAttribute("data-key"));
  });
  document.querySelectorAll(".btn-hapus").forEach(btn => {
    btn.onclick = () => hapusData(btn.getAttribute("data-key"));
  });
}

function editData(key) {
  const item = db.find(x => x.firebaseKey === key);
  let nama = prompt("Nama baru:", item.nama);
  let produk = prompt("Produk baru:", item.produk);
  let harga = prompt("Harga baru:", item.harga);
  let status = prompt("Status baru (SUKSES/PENDING/PROSES/GAGAL):", item.status);

  if(nama && produk && harga && status) {
    const singleRef = ref(database, 'transaksi/' + key);
    update(singleRef, { nama, produk, harga: Number(harga), status }).then(() => {
      riwayat();
    });
  }
}

function hapusData(key) {
  if(confirm("Hapus transaksi ini dari cloud?")) {
    const singleRef = ref(database, 'transaksi/' + key);
    remove(singleRef).then(() => {
      riwayat();
    });
  }
}

function grafik(){
  document.getElementById("status-halaman").value = "grafik";
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });

  app.innerHTML=`
    <div class="card">
      <button id="btn-back-dash2">⬅ Kembali</button>
      <canvas id="chart"></canvas>
    </div>
  `;
  document.getElementById("btn-back-dash2").onclick = dashboard;

  setTimeout(()=>{
    new Chart(document.getElementById("chart"),{
      type:"line",
      data:{
        labels:Object.keys(map),
        datasets:[{
          label: 'Omset Sukses',
          data:Object.values(map),
          borderColor:"#4f46e5",
          tension:0.4
        }]
      }
    });
  },200);
}

// Menghubungkan modul fungsi internal ke objek global/window seandainya dibutuhkan
window.dashboard = dashboard;
window.form = form;
window.riwayat = riwayat;
window.grafik = grafik;
window.sendGrafik = sendGrafik;

// Jalankan pertama kali setelah koneksi siap
setTimeout(dashboard, 1000);
</script>
</head>

<body>
  <input type="hidden" id="status-halaman" value="dashboard">
  <div class="header">K7N STORE</div>
  <div class="container" id="app">Membuka koneksi database...</div>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
    .header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
    .container{padding:15px}
    .card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
    input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
    button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
    .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
