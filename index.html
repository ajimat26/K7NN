<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}
.header{background:linear-gradient(90deg,#4f46e5,#06b6d4);padding:15px;text-align:center;color:white;font-weight:bold;}
.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto;}

.card{background:var(--card);padding:15px;border-radius:15px;margin-bottom:10px;}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none;background:#020617;color:white;}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:10px;background:var(--tema);color:white;}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.menu div{background:var(--card);padding:20px;text-align:center;border-radius:10px;cursor:pointer;}

.struk{background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;font-family:monospace;}
.line{border-bottom:1px dashed #aaa;margin:8px 0;}
</style>
</head>

<body>

<div class="container">
<div class="header">K7N STORE</div>
<div class="content" id="app"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");
let db = JSON.parse(localStorage.getItem("k7n"))||[];

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

/* 🔥 WEBHOOK */
const WEBHOOK_TESTI = "https://discord.com/api/webhooks/1497806134692810943/giut3tk-1F64WHwCyas9p6fQcl5q3JCWpWlvhXc3A3yNKiQal6WWLXHfRedlwmcTVVVH";
const WEBHOOK_GRAFIK = "https://discord.com/api/webhooks/1497825833295806477/9avVXxaqYpdlCiR-Rwzgsnw8FeKW218LXMUt9K5BzsxHxVn7ccty8VP7cj2K5gDcQH9V";

/* PRODUK */
const produk=[
{nama:"Follower Indo 100",harga:10500},
{nama:"Follower Global 100",harga:5000},
{nama:"Like TikTok 100",harga:800},
{nama:"Viewer 1000",harga:800}
];

/* FORMAT */
function rupiah(x){
return "Rp "+Number(x).toLocaleString("id-ID");
}

/* 📤 KIRIM STRUK */
async function kirimStruk(d){
try{
await fetch(WEBHOOK_TESTI,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
embeds:[{
title:"🧾 STRUK BARU",
color:3066993,
fields:[
{name:"ID",value:d.id,inline:true},
{name:"Nama",value:d.nama,inline:true},
{name:"Produk",value:d.produk},
{name:"Harga",value:rupiah(d.harga)},
{name:"Status",value:d.status}
],
timestamp:new Date()
}]
})
});
}catch(e){}
}

/* 📊 KIRIM GRAFIK */
async function kirimGrafik(){
try{

let map={}, total=0, jumlah=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
jumlah++;
}
});

let canvas=document.createElement("canvas");
canvas.width=800;
canvas.height=400;

new Chart(canvas,{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),tension:0.3}]
},
options:{animation:false}
});

await new Promise(r=>setTimeout(r,500));

const blob=await new Promise(res=>canvas.toBlob(res));

let form=new FormData();
form.append("file",blob,"grafik.png");

form.append("payload_json",JSON.stringify({
username:"K7N STORE",
content:`📊 LAPORAN HARIAN
🕒 ${new Date().toLocaleString("id-ID")}
💰 ${rupiah(total)}
📦 ${jumlah} transaksi`
}));

await fetch(WEBHOOK_GRAFIK,{method:"POST",body:form});

}catch(e){}
}

/* kirim tiap 1 jam */
setInterval(kirimGrafik,3600000);

/* PAGE */
function page(p){

if(p==="dashboard"){
let total=0;
db.forEach(x=>{if(x.status==="SUKSES")total+=Number(x.harga)});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rupiah(total)}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
</div>`;
}

/* BUAT */
if(p==="buat"){
let opt=produk.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️</button>

<input id="nama" placeholder="Nama">

<select id="produk" onchange="autoHarga()">
<option value="">Pilih Produk</option>
${opt}
<option value="custom">Custom</option>
</select>

<input id="customNama" placeholder="Nama Custom">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>
<div id="hasil"></div>
</div>`;
}

window.autoHarga=function(){
let v=document.getElementById("produk").value;
if(v!=="" && v!=="custom"){
document.getElementById("harga").value=produk[v].harga;
}
}

/* BUAT */
window.buat=function(){

let nama=document.getElementById("nama").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;
let p=document.getElementById("produk").value;
let customNama=document.getElementById("customNama").value;

if(!nama||!harga)return alert("Isi data!");

let namaProduk = p==="custom" ? (customNama||"Custom") : (produk[p]?.nama||"Produk");

let obj={
id:"K7N-"+Math.random().toString(36).substr(2,5),
nama,
produk:namaProduk,
harga:Number(harga),
status,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

/* kirim ke discord */
kirimStruk(obj);

/* tampilkan struk */
document.getElementById("hasil").innerHTML=`
<div id="strukBox" class="struk">
<h3>K7N STORE</h3>
<div class="line"></div>
<p>ID: ${obj.id}</p>
<p>Nama: ${nama}</p>
<p>Produk: ${namaProduk}</p>
<div class="line"></div>
<p>Harga: ${rupiah(obj.harga)}</p>
<div class="line"></div>
<p>Status: ${status}</p>
</div>

<button onclick="download()">Download</button>
<button onclick='wa(${JSON.stringify(obj)})'>WhatsApp</button>
`;
}

/* DOWNLOAD */
window.download=function(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
window.wa=function(x){
let t=`ID:${x.id}\nNama:${x.nama}\nProduk:${x.produk}\nHarga:${rupiah(x.harga)}`;
window.open("https://wa.me/?text="+encodeURIComponent(t));
}

/* RIWAYAT */
if(p==="riwayat"){
let html=`<button onclick="page('dashboard')">⬅️</button>`;
db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
${rupiah(x.harga)}<br>
${x.status}
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});
app.innerHTML=html;
}

window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);
save();
page("riwayat");
}
}

/* GRAFIK */
if(p==="grafik"){
let map={};
db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});

app.innerHTML=`<button onclick="page('dashboard')">⬅️</button><canvas id="chart"></canvas>`;

setTimeout(()=>{
new Chart(document.getElementById("chart"),{
type:"line",
data:{labels:Object.keys(map),datasets:[{data:Object.values(map),tension:0.3}]}
});
},100);
}

}

window.page=page;
page("dashboard");

});
</script>

</body>
</html>
