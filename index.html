<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N Web Tester</title>
<style>
body {
    margin: 0;
    font-family: Arial;
}

/* PREVIEW */
iframe {
    width: 100%;
    height: 100vh;
    border: none;
}

/* BUTTON OPEN */
.open-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: gold;
    padding: 10px;
    cursor: pointer;
    z-index: 1000;
    border-radius: 8px;
}

/* OVERLAY */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    z-index: 2000;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 80%;
    background: #111;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    border: none;
    outline: none;
}

/* BUTTONS */
.controls {
    padding: 10px;
    background: #222;
    text-align: center;
}

.btn {
    background: gold;
    margin: 5px;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-block;
}
</style>
</head>

<body>

<div class="open-btn" onclick="openEditor()">⚙ EDIT</div>

<iframe id="preview"></iframe>

<div class="overlay" id="overlay">
    <textarea id="code"></textarea>

    <div class="controls">
        <div class="btn" onclick="runCode()">▶ RUN</div>
        <div class="btn" onclick="closeEditor()">❌ CLOSE</div>
    </div>
</div>

<script>
// DEFAULT CODE
let defaultCode = `
<!DOCTYPE html>
<html>
<head>
<style>
body { background: black; color: white; text-align: center; }
.box { background: gold; padding: 20px; margin: 50px; }
</style>
</head>
<body>

<h1>Halo K7N 🚀</h1>
<div class="box">Ini Preview Website Kamu</div>

</body>
</html>
`;

document.getElementById("code").value = defaultCode;

// RUN CODE
function runCode() {
    let code = document.getElementById("code").value;
    let iframe = document.getElementById("preview").contentWindow.document;
    iframe.open();
    iframe.write(code);
    iframe.close();
}

// OPEN / CLOSE
function openEditor() {
    document.getElementById("overlay").style.display = "flex";
}

function closeEditor() {
    document.getElementById("overlay").style.display = "none";
}

// LOAD AWAL
runCode();
</script>

</body>
</html>
