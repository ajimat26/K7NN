<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>

<script src="https://jsdelivr.net"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
const app=document.getElementById("app");

// URL Penyimpanan Online Bersama (Telah disesuaikan dengan double strip '--' proyek Anda)
const DB_URL = "https://firebasedatabase.app";

const WEBHOOK_STRUK="https://discord.com";
const WEBHOOK_GRAFIK="https://discord.com";

let db = [];
let statusKoneksi = "Menghubungkan ke Pusat...";

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

/* ================= AMBIL DATA DARI PUSAT (OTOMATIS SINKRON) ================= */
async function muatDataDariPusat() {
  try {
    const respon = await fetch(DB_URL);
    const data = await respon.json();
    db = [];
    if (data) {
      // Mengubah kiriman data awan menjadi daftar array rapi di web
      Object.keys(data).forEach(key => {
        if(data[key]) db.push({ firebaseKey: key, ...data[key] });
      });
    }
    statusKoneksi = "Terhubung (Bersama)";
    
    // Perbarui angka di layar dashboard secara live jika elemennya sedang aktif terbuka
    const txtOmset = document.getElementById("txt-omset");
    const txtTx = document.getElementById("txt-transaksi");
    if(txtOmset && txtTx) {
      let total = 0;
      db.forEach(x => { if(x.status === "SUKSES") total += Number(x.harga); });
      txtOmset.innerText = "💰 " + formatRp(total);
      txtTx.innerText = "📦 " + db.length + " transaksi";
    }
  } catch (error) {
    statusKoneksi = "Koneksi Terputus";
    console.error(error);
  }
}

/* ================= DASHBOARD ================= */
function dashboard(){
  let total=0;
  db.forEach(x=>{
    if(x.status==="SUKSES") total+=Number(x.harga);
  });

  app.innerHTML=`
    <div class="card">
      <h3>Dashboard (Cloud Bersama)</h3>
      <p id="txt-omset">💰 ${formatRp(total)}</p>
      <p id="txt-transaksi">📦 ${db.length} transaksi</p>
      <small style="color: #94a3b8; font-size:11px;">Status: ${statusKoneksi}</small>
    </div>

    <div class="menu">
      <div onclick="form()">📦 Buat</div>
      <div onclick="riwayat()">📊 Riwayat</div>
      <div onclick="grafik()">📈 Grafik</div>
      <div onclick="sendGrafik()">⏱ Kirim Grafik</div>
    </div>
  `;
}

/* ================= FORM INPUT ================= */
function form(){
  app.innerHTML=`
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama">
      <input id="produk" placeholder="Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button onclick="buat()">Simpan & Sebarkan</button>
      <div id="hasil"></div>
    </div>
  `;
}

/* ================= PROSES SIMPAN KE PUSAT WEB ================= */
async function buat(){
  const namaInput = document.getElementById("nama").value;
  const produkInput = document.getElementById("produk").value;
  const hargaInput = document.getElementById("harga").value;
  const statusInput = document.getElementById("status").value;

  if(!namaInput || !produkInput || !hargaInput) {
    return alert("Semua data wajib diisi!");
  }

  let obj={
    id:"K7N-"+Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: namaInput,
    produk: produkInput,
    harga: Number(hargaInput),
    status: statusInput || "PENDING",
    tanggal: new Date().toISOString()
  };

  try {
    // Mengirim langsung data ke server penyimpanan agar langsung menyebar ke HP teman Anda
    const respon = await fetch(DB_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj)
    });
    
    if(respon.ok) {
      sendStruk(obj);
      document.getElementById("hasil").innerHTML=`
        <div class="struk">
          <b>✓ BERHASIL DISIMPANKAN</b><br><br>
          ID:${obj.id}<br>
          Nama:${obj.nama}<br>
          Produk:${obj.produk}<br>
          Harga:${formatRp(obj.harga)}<br>
          Status:${obj.status}
        </div>
      `;
      muatDataDariPusat();
    } else {
      alert("Gagal mengirim data. Pastikan menu RULES di Firebase diatur ke TRUE!");
    }
  } catch (e) {
    alert("Gagal memproses data: " + e.message);
  }
}

/* ================= RIWAYAT (EDIT + HAPUS ONLINE) ================= */
function riwayat(){
  let html=`<button onclick="dashboard()">⬅ Kembali</button><h3>Riwayat Transaksi Cloud</h3>`;

  if(db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada riwayat transaksi online.</p>`;
  } else {
    db.slice().reverse().forEach((x)=>{
        html+=`
          <div class="card">
            <b>ID: ${x.id}</b><br>
            ${x.nama} - ${x.produk}<br>
            ${formatRp(x.harga)}<br>
            Status: <b>${x.status}</b><br><br>
            <button onclick="editOnline('${x.firebaseKey}')" style="width:auto; padding:5px 15px;">Edit</button>
            <button onclick="hapusOnline('${x.firebaseKey}')" style="width:auto; padding:5px 15px; background:#ef4444;">Hapus</button>
          </div>
        `;
      });
  }
  app.innerHTML=html;
}

async function editOnline(key) {
  const item = db.find(x => x.firebaseKey === key);
  let nama = prompt("Nama baru:", item.nama);
  let produk = prompt("Produk baru:", item.produk);
  let harga = prompt("Harga baru:", item.harga);
  let status = prompt("Status baru:", item.status);

  if(nama && produk && harga && status) {
    const urlEdit = `https://firebasedatabase.app{key}.json`;
    await fetch(urlEdit, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nama, produk, harga: Number(harga), status: status.toUpperCase() })
    });
    await muatDataDariPusat();
    riwayat();
  }
}

async function hapusOnline(key) {
  if(confirm("Hapus transaksi ini dari memori pusat bersama?")) {
    const urlHapus = `https://firebasedatabase.app{key}.json`;
    await fetch(urlHapus, { method: "DELETE" });
    await muatDataDariPusat();
    riwayat();
  }
}

/* ================= GRAFIK WEB ================= */
function grafik(){
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });

  app.innerHTML=`
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <canvas id="chart"></canvas>
    </div>
  `;

  setTimeout(()=>{
    new Chart(document.getElementById("chart"),{
      type:"line",
      data:{
        labels:Object.keys(map),
        datasets:[{
          label: 'Omset Sukses',
          data:Object.values(map),
          borderColor:"#4f46e5",
          tension:0.4
        }]
      }
    });
  },200);
}

/* ================= DISCORD STRUK ================= */
async function sendStruk(x){
  try {
    await fetch(WEBHOOK_STRUK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        embeds:[{
          title:"🧾 STRUK TRANSAKSI K7N STORE",
          color:5763719,
          fields:[
            {name:"ID",value:x.id,inline:true},
            {name:"Nama",value:x.nama,inline:true},
            {name:"Produk",value:x.produk,inline:true},
            {name:"Harga",value:formatRp(x.harga),inline:true},
            {name:"Status",value:x.status,inline:true}
          ]
        }]
      })
    });
  } catch(e) {}
}

async function sendGrafik(){
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });
  let keys=Object.keys(map);
  let values=Object.values(map);
  let total=values.reduce((a,b)=>a+b,0);
  let lines=keys.map((k,i)=> `${k} → ${formatRp(values[i])}`).join("\n");

  try {
    await fetch(WEBHOOK_GRAFIK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        embeds:[{
          title:"📊 LAPORAN GRAFIK K7N STORE",
          description: "```" + lines + "```",
          fields: [
            { name: "TOTAL", value: formatRp(total), inline: true },
            { name: "TRANSAKSI", value: String(db.length), inline: true }
          ]
        }]
      })
    });
    alert("Laporan grafik sukses dikirim ke Discord!");
  } catch(e){}
}

/* ================= KENDALI UTAMA ================= */
dashboard();
muatDataDariPusat();
