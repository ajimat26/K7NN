<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
--accent:#22d3ee;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}

.header{
background:linear-gradient(90deg,#4f46e5,#06b6d4);
padding:15px;text-align:center;color:white;font-weight:bold;
}

.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto;}

.card{
background:var(--card);
padding:15px;border-radius:15px;margin-bottom:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

input,select{
width:100%;padding:10px;margin:5px 0;border-radius:10px;
border:none;background:#020617;color:white;
}

button{
width:100%;padding:10px;margin-top:5px;border:none;
border-radius:10px;background:linear-gradient(90deg,#4f46e5,#06b6d4);
color:white;cursor:pointer;
}

.menu{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}

.menu div{
background:var(--card);padding:20px;text-align:center;
border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
}

.struk{
background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;
font-family:monospace;
}

.line{border-bottom:1px dashed #aaa;margin:8px 0;}

.status{padding:4px;border-radius:5px;color:white;font-size:12px;}
.sukses{background:green}.pending{background:orange}.proses{background:blue}.gagal{background:red}

</style>
</head>

<body>

<div class="container">
<div class="header">K7N STORE</div>
<div class="content" id="app"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");
let db = JSON.parse(localStorage.getItem("k7n"))||[];

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

const produk=[
{nama:"Follower Indo 100",harga:10500},
{nama:"Follower Global 100",harga:5000},
{nama:"Like TikTok 100",harga:800},
{nama:"Viewer 1000",harga:800}
];

function page(p){

if(p=="dashboard"){
let total=0;
db.forEach(x=>{if(x.status=="SUKSES")total+=Number(x.harga)});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 Rp ${total.toLocaleString("id-ID")}</p>
<p>📦 ${db.length} Transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
<div onclick="page('setting')">⚙️ Setting</div>
</div>
`;
}

/* BUAT */
if(p=="buat"){
let opt=produk.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>

<h3>Buat Struk</h3>
<input id="nama" placeholder="Nama">

<select id="produk" onchange="autoHarga()">
<option value="">Pilih</option>
${opt}
<option value="custom">Custom</option>
</select>

<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>
<div id="hasil"></div>
</div>
`;
}

/* AUTO HARGA */
window.autoHarga=function(){
let v=document.getElementById("produk").value;
if(v!=="custom" && v!==""){
document.getElementById("harga").value=produk[v].harga;
}
}

/* BUAT */
window.buat=function(){
let nama=namaInput("nama");
let harga=namaInput("harga");
let status=document.getElementById("status").value;

if(!nama||!harga)return alert("Isi dulu!");

let id="K7N-"+Math.random().toString(36).substr(2,5);
let t=new Date().toISOString();

let obj={id,nama,harga,status,tanggal:t};
db.push(obj);save();

hasil.innerHTML=`
<div id="strukBox" class="struk">
<h3>K7N STORE</h3>
<div class="line"></div>
<p>ID: ${id}</p>
<p>Nama: ${nama}</p>
<div class="line"></div>
<p>Harga: Rp ${Number(harga).toLocaleString("id-ID")}</p>
<div class="line"></div>
<p>Status: <span class="${status.toLowerCase()}">${status}</span></p>
</div>

<button onclick="download()">Download</button>
<button onclick='wa(${JSON.stringify(obj)})'>WhatsApp</button>
`;
}

/* HELPER */
function namaInput(id){
return document.getElementById(id).value.trim();
}

/* DOWNLOAD */
window.download=function(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
window.wa=function(x){
let t=`ID:${x.id}\nNama:${x.nama}\nHarga:${x.harga}`;
window.open("https://wa.me/?text="+encodeURIComponent(t));
}

/* RIWAYAT */
if(p=="riwayat"){
let html=`<button onclick="page('dashboard')">⬅️ Kembali</button>`;
db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama}<br>
Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
${x.status}
<button onclick="edit(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});
app.innerHTML=html;
}

/* EDIT */
window.edit=function(i){
let x=db[i];
let nama=prompt("Nama",x.nama);
let harga=prompt("Harga",x.harga);
let status=prompt("Status",x.status);
if(!nama||!harga||!status)return;
db[i]={...x,nama,harga,status};
save();page("riwayat");
}

/* HAPUS */
window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);save();page("riwayat");
}
}

/* GRAFIK */
if(p=="grafik"){
let map={};
db.forEach(x=>{
if(x.status=="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});

app.innerHTML=`
<button onclick="page('dashboard')">⬅️ Kembali</button>
<canvas id="chart"></canvas>
`;

setTimeout(()=>{
new Chart(chart,{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),tension:0.3}]
}
});
},100);
}

/* SETTING */
if(p=="setting"){
let tema=localStorage.getItem("tema")||"#4f46e5";
let bg=localStorage.getItem("bg")||"#0f172a";

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>

<h3>Setting</h3>

<label>Tema</label>
<input type="color" id="color" value="${tema}">

<label>Background</label>
<input type="color" id="bgcolor" value="${bg}">

<button onclick="saveTheme()">Simpan</button>
</div>
`;
}

}

/* SAVE THEME */
window.saveTheme=function(){
let t=document.getElementById("color").value;
let b=document.getElementById("bgcolor").value;
localStorage.setItem("tema",t);
localStorage.setItem("bg",b);
document.documentElement.style.setProperty('--tema',t);
document.documentElement.style.setProperty('--bg',b);
alert("Disimpan!");
}

window.page=page;
page("dashboard");

});
</script>

</body>
</html>
