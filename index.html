<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE FINAL PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:15px;text-align:center;background:linear-gradient(90deg,#4f46e5,#06b6d4);font-weight:bold}
.content{padding:20px}

.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}

input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#020617;color:white}

button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px;background:#4f46e5;color:white}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}

.struk{background:white;color:black;padding:15px;border-radius:10px;font-family:monospace}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="content" id="app">Loading...</div>

<script>

let app=document.getElementById("app");

/* DATABASE */
let db=JSON.parse(localStorage.getItem("k7n_db"))||[];

function save(){
localStorage.setItem("k7n_db",JSON.stringify(db));
}

function rp(x){
return "Rp "+Number(x).toLocaleString("id-ID");
}

/* 🔥 WEBHOOK (PASTE DI SINI) */
const WEBHOOK="PASTE_WEBHOOK_DISCORD_KAMU";

/* =========================
   DISCORD STRUK
========================= */
async function kirimDiscord(d){

if(!WEBHOOK) return;

try{

fetch(WEBHOOK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
embeds:[{
title:"🧾 TRANSAKSI BARU",
color:3066993,
fields:[
{name:"ID",value:d.id},
{name:"Nama",value:d.nama},
{name:"Harga",value:rp(d.harga)},
{name:"Status",value:d.status}
],
timestamp:new Date()
}]
})
});

}catch(e){
console.log("Discord error",e);
}
}

/* =========================
   PAGE SYSTEM
========================= */
function page(p){

/* DASHBOARD */
if(p==="dashboard"){

let total=0;
db.forEach(x=>{
if(x.status==="SUKSES")total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rp(total)}</p>
<p>📦 ${db.length}</p>
</div>

<div class="menu">
<div onclick="page('buat')">Buat</div>
<div onclick="page('riwayat')">Riwayat</div>
<div onclick="page('grafik')">Grafik</div>
<div onclick="location.reload()">Reload</div>
</div>
`;
}

/* BUAT */
if(p==="buat"){

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>

<input id="nama" placeholder="Nama">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat Struk</button>

<div id="hasil"></div>
</div>
`;
}

/* BUAT STRUK */
window.buat=function(){

let nama=document.getElementById("nama").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

if(!nama||!harga)return alert("Isi data!");

let obj={
id:"K7N-"+Math.random().toString(36).substr(2,6),
nama,
harga:Number(harga),
status,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

/* 🔥 KIRIM DISCORD */
kirimDiscord(obj);

/* STRUK */
document.getElementById("hasil").innerHTML=`
<div class="struk" id="strukBox">
<h3>K7N STORE</h3>
<p>ID: ${obj.id}</p>
<p>Nama: ${obj.nama}</p>
<p>${rp(obj.harga)}</p>
<p>Status: ${obj.status}</p>
</div>

<button onclick="download()">Download</button>
<button onclick="wa()">WhatsApp</button>
`;
};

/* DOWNLOAD */
window.download=function(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
};

/* WA */
window.wa=function(){
let x=db[db.length-1];
window.open("https://wa.me/?text="+encodeURIComponent(
`ID:${x.id}\nNama:${x.nama}\nHarga:${x.harga}`
));
};

/* RIWAYAT */
if(p==="riwayat"){

let html=`<button onclick="page('dashboard')">⬅</button>`;

db.slice().reverse().forEach(x=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama}<br>
${rp(x.harga)}<br>
${x.status}
</div>`;
});

app.innerHTML=html;
}

/* GRAFIK */
if(p==="grafik"){

let map={};

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>
<h3>Grafik Penjualan</h3>
</div>

<canvas id="chart"></canvas>
`;

setTimeout(()=>{
new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),tension:0.3}]
}
});
},200);
}

}

/* START */
window.page=page;
page("dashboard");

</script>

</body>
</html>
