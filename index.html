<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>

<script src="https://jsdelivr.net"></script>
<script src="https://hertzen.com"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
--accent:#22d3ee;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}

.header{
background:linear-gradient(90deg, var(--tema), #06b6d4);
padding:15px;text-align:center;color:white;font-weight:bold;
display:flex;justify-content:space-between;align-items:center;
}
.header div{flex:1;}
.logout-btn{background:rgba(255,255,255,0.2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;max-width:fit-content;}

.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto;}

.card{
background:var(--card);
padding:15px;border-radius:15px;margin-bottom:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

input,select{
width:100%;padding:10px;box-sizing:border-box;margin:5px 0;border-radius:10px;
border:none;background:#020617;color:white;
}

button{
width:100%;padding:10px;margin-top:5px;border:none;
border-radius:10px;background:linear-gradient(90deg, var(--tema), #06b6d4);
color:white;cursor:pointer;font-weight:bold;
}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.menu div{
background:var(--card);padding:20px;text-align:center;
border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
}

.struk{background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;font-family:monospace;}
.line{border-bottom:1px dashed #aaa;margin:8px 0;}
.status{padding:4px;border-radius:5px;color:white;font-size:12px;}
.sukses{background:green}.pending{background:orange}.proses{background:blue}.gagal{background:red}
</style>
</head>

<body>

<div class="container">
<div class="header">
    <div style="text-align:left; font-size:14px;" id="adminInfo">Admin: -</div>
    <div style="font-size:18px;">K7N STORE</div>
    <div style="text-align:right;"><span class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Logout</span></div>
</div>
<div class="content" id="app"></div>
</div>

<script>
// MASUKKAN URL WEBHOOK DISCORD ANDA DI SINI
const DISCORD_WEBHOOK_URL = "MASUKKAN_URL_WEBHOOK_DISCORD_DISINI";

document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");

// Menangkap pendaftaran dari domain NVRZ
let urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('action') === 'register'){
    let u = urlParams.get('user');
    let p = urlParams.get('pass');
    if(u && p){
        let users = JSON.parse(localStorage.getItem("k7n_users")) || {};
        users[u] = p;
        localStorage.setItem("k7n_users", JSON.stringify(users));
        alert("Akun berhasil dibuat! Silakan login menggunakan akun baru Anda.");
        window.history.replaceState({}, document.title, window.location.pathname);
    }
}

let db = JSON.parse(localStorage.getItem("k7n"))||[];
let sessionUser = sessionStorage.getItem("k7n_session") || null;

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

function loadTheme() {
    let t = localStorage.getItem("tema") || "#4f46e5";
    let b = localStorage.getItem("bg") || "#0f172a";
    document.documentElement.style.setProperty('--tema', t);
    document.documentElement.style.setProperty('--bg', b);
}
loadTheme();

const produk=[
{nama:"Follower Indo 100",harga:10500},
{nama:"Follower Global 100",harga:5000},
{nama:"Like TikTok 100",harga:800},
{nama:"Viewer 1000",harga:800}
];

function showLoginPage(){
    document.getElementById("adminInfo").innerText = "Admin: -";
    document.getElementById("logoutBtn").style.display = "none";
    app.innerHTML = `
    <div class="card" style="max-width:350px; margin: 40px auto 0 auto;">
        <h3 style="text-align:center; color:var(--accent); margin-top:0;">Login Admin K7N</h3>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="login()">Masuk</button>
        <p style="text-align:center; font-size:13px; color:#aaa; margin-top:15px;">
            Belum punya akun? <a href="https://github.io" style="color:var(--accent); text-decoration:none; font-weight:bold;">Buat Akun</a>
        </p>
    </div>
    `;
}

window.login = function(){
    let u = document.getElementById("loginUser").value.trim();
    let p = document.getElementById("loginPass").value.trim();
    let users = JSON.parse(localStorage.getItem("k7n_users")) || {};
    
    if(users[u] && users[u] === p){
        sessionStorage.setItem("k7n_session", u);
        sessionUser = u;
        page("dashboard");
    } else {
        alert("Username atau Password salah!");
    }
}

window.logout = function(){
    sessionStorage.removeItem("k7n_session");
    sessionUser = null;
    showLoginPage();
}

function page(p){
    // JIKA BELUM LOGIN, PAKSA KE HALAMAN LOGIN
    if(!sessionUser){
        showLoginPage();
        return;
    }

    // Pasang nama admin di header dan aktifkan tombol logout
    document.getElementById("adminInfo").innerText = "Admin: " + sessionUser;
    document.getElementById("logoutBtn").style.display = "inline-block";

    if(p=="dashboard"){
        let total=0;
        db.forEach(x=>{if(x.status=="SUKSES")total+=Number(x.harga)});

        app.innerHTML=`
        <div class="card">
        <h3>Selamat Datang, ${sessionUser} 👋</h3>
        <p>💰 Total Pendapatan: Rp ${total.toLocaleString("id-ID")}</p>
        <p>📦 Total: ${db.length} Transaksi</p>
        </div>

        <div class="menu">
        <div onclick="page('buat')">📦 Buat</div>
        <div onclick="page('riwayat')">📊 Riwayat</div>
        <div onclick="page('grafik')">📈 Grafik</div>
        <div onclick="page('setting')">⚙️ Setting</div>
        </div>
        `;
    }

    /* BUAT TRANSAKSI */
    if(p=="buat"){
        let opt=produk.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");

        app.innerHTML=`
        <div class="card">
        <button onclick="page('dashboard')">⬅️ Kembali</button>
        <h3>Buat Struk</h3>
        <input id="nama" placeholder="Nama Pembeli">
        <select id="produk" onchange="autoHarga()">
        <option value="">Pilih Produk</option>
        ${opt}
        <option value="custom">Custom</option>
        </select>
        <input id="harga" type="number" placeholder="Harga">
        <select id="status">
        <option>SUKSES</option>
        <option>PENDING</option>
        <option>PROSES</option>
        <option>GAGAL</option>
        </select>
        <button onclick="buat()">Buat & Kirim</button>
        <div id="hasil"></div>
        </div>
        `;
    }

    /* RIWAYAT */
    if(p=="riwayat"){
        let html=`<button onclick="page('dashboard')">⬅️ Kembali</button><br><br>`;
        if(db.length === 0) {
            html += `<div class="card"><p>Belum ada transaksi.</p></div>`;
        } else {
            db.map((x, i) => ({...x, indexAsli: i}))
              .reverse()
              .forEach((x)=>{
                html+=`
                <div class="card">
                <b>${x.id}</b><br>
                Pelanggan: ${x.nama}<br>
                Harga: Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
                Admin: ${x.admin || "System"}<br>
                Status: <span class="status ${x.status.toLowerCase()}">${x.status}</span>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button onclick="edit(${x.indexAsli})">Edit</button>
                    <button onclick="hapus(${x.indexAsli})" style="background:red;">Hapus</button>
                </div>
                </div>`;
            });
        }
        app.innerHTML=html;
    }

    /* GRAFIK */
    if(p=="grafik"){
        let map={};
        db.forEach(x=>{
            if(x.status=="SUKSES"){
                let t=new Date(x.tanggal).toLocaleDateString("id-ID");
                map[t]=(map[t]||0)+Number(x.harga);
            }
        });
        app.innerHTML=`<button onclick="page('dashboard')">⬅️ Kembali</button><div class="card" style="margin-top:10px;"><canvas id="chart"></canvas></div>`;
        setTimeout(()=>{
            new Chart(document.getElementById("chart"),{
                type:"line",
                data:{
                    labels:Object.keys(map),
                    datasets:[{ label: 'Pendapatan Sukses', data:Object.values(map), borderColor: '#22d3ee', tension:0.3, fill: false }]
                },
                options: { scales: { y: { ticks: { color: '#e5e7eb' } }, x: { ticks: { color: '#e5e7eb' } } } }
            });
        },100);
    }

    /* SETTING */
    if(p=="setting"){
        let tema=localStorage.getItem("tema")||"#4f46e5";
        let bg=localStorage.getItem("bg")||"#0f172a";
        app.innerHTML=`
        <div class="card">
        <button onclick="page('dashboard')">⬅️ Kembali</button>
        <h3>Setting Tema</h3>
        <label>Warna Utama</label><input type="color" id="color" value="${tema}">
        <label>Warna Background</label><input type="color" id="bgcolor" value="${bg}">
        <button onclick="saveTheme()">Simpan Perubahan</button>
        </div>
        `;
    }
}

/* AUTO HARGA */
window.autoHarga=function(){
    let v=document.getElementById("produk").value;
    if(v!=="custom" && v!==""){
        document.getElementById("harga").value=produk[v].harga;
    } else {
        document.getElementById("harga").value="";
    }
}

/* BUAT STRUK */
window.buat=function(){
    let nama=namaInput("nama");
    let harga=namaInput("harga");
    let status=document.getElementById("status").value;
    let hasilBox=document.getElementById("hasil");

    if(!nama||!harga)return alert("Isi dulu semua data!");
let id="K7N-"+Math.random().toString(36).substr(2,5).toUpperCase();let t=new Date().toISOString();let obj={id,nama,harga: Number(harga),status,tanggal:t, admin: sessionUser};db.push(obj);save();hasilBox.innerHTML=`K7N STOREID: ${id}Nama: ${nama}Harga: Rp ${Number(harga).toLocaleString("id-ID")}Admin: ${sessionUser}Status: ){status}Download GambarKirim ke WhatsApp`;kirimKeDiscord(obj);}function kirimKeDiscord(x){if(!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("MASUKKAN_URL")) return;let isiPesan = {embeds: [{title: "🚨 NOTIFIKASI TRANSAKSI BARU - K7N STORE",color: x.status === "SUKSES" ? 3066993 : 15158332,fields: [{ name: "ID Transaksi", value: ""+x.id+"", inline: true },{ name: "Pelanggan", value: x.nama, inline: true },{ name: "Harga", value: "Rp " + Number(x.harga).toLocaleString("id-ID"), inline: false },{ name: "Status", value: ""+x.status+"", inline: true },{ name: "Admin Penanggung Jawab", value: "👤 Admin:" + x.admin, inline: true }],timestamp: x.tanggal}]};fetch(DISCORD_WEBHOOK_URL, {method: "POST",headers: { "Content-Type": "application/json" },body: JSON.stringify(isiPesan)}).catch(err => console.log("Gagal kirim ke Discord:", err));}function namaInput(id){ return document.getElementById(id).value.trim(); }window.download=function(){html2canvas(document.getElementById("strukBox")).then(c=>{let a=document.createElement("a");a.href=c.toDataURL(); a.download="struk.png"; a.click();});}window.wa=function(x){let t=ID: ${x.id}\nNama: ${x.nama}\nHarga: Rp ${Number(x.harga).toLocaleString("id-ID")}\nAdmin: Admin:${x.admin}\nStatus: ${x.status};window.open("wa.me"+encodeURIComponent(t));}window.edit=function(i){let x=db[i];let nama=prompt("Ubah Nama Pembeli:", x.nama);let harga=prompt("Ubah Harga:", x.harga);let status=prompt("Ubah Status:", x.status);if(!nama||!harga||!status)return;db[i]={...x, nama, harga: Number(harga), status: status.toUpperCase()};save();page("riwayat");}window.hapus=function(i){if(confirm("Hapus transaksi ini?")){ db.splice(i,1);save();page("riwayat"); }}window.saveTheme=function(){let t=document.getElementById("color").value;let b=document.getElementById("bgcolor").value;localStorage.setItem("tema",t); localStorage.setItem("bg",b);document.documentElement.style.setProperty('--tema',t); document.documentElement.style.setProperty('--bg',b);alert("Tema berhasil disimpan!");}window.page=page;// JALANKAN PROSES PEMERIKSAAN HALAMAN AWALif(!sessionUser){showLoginPage();} else {page("dashboard");}});
