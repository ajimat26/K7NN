<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All-in-One Cyber Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  margin:0;
  background:#020617;
  color:#e5e7eb;
  font-family:Arial,Helvetica,sans-serif;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:14px;
  padding:15px;
  margin:15px;
}
h3{color:#22d3ee}
input,textarea{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:1px solid #334155;
  background:#000;
  color:#fff;
}
button{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  background:linear-gradient(90deg,#22d3ee,#a855f7);
}
canvas{display:block;margin:10px auto}
.result input{margin-top:6px}
</style>
</head>
<body>

<!-- TIKTOK -->
<div class="card">
<h3>📥 TikTok Downloader</h3>
<input id="ttUrl" placeholder="Paste TikTok URL">
<button onclick="downloadTT()">Generate Download Link</button>
<div id="ttResult" class="result"></div>
</div>

<!-- YOUTUBE -->
<div class="card">
<h3>📥 YouTube Downloader</h3>
<input id="ytUrl" placeholder="Paste YouTube URL">
<button onclick="downloadYT()">Generate Download Link</button>
<div id="ytResult" class="result"></div>
</div>

<!-- QR -->
<div class="card">
<h3>🔳 QR Generator (Logo Embedded)</h3>
<input id="qrText" placeholder="Text / Link">
<button onclick="makeQR()">Generate QR</button>
<canvas id="qrCanvas" width="300" height="300"></canvas>
<button onclick="downloadQR()">Download QR Image</button>
</div>

<!-- UNBANNED -->
<div class="card">
<h3>✅ WhatsApp Unbanned Request</h3>
<input id="unName" placeholder="Your Name">
<input id="unNumber" placeholder="WhatsApp Number">
<button onclick="unbanWA()">Open Gmail</button>
</div>

<!-- BANNED -->
<div class="card">
<h3>🚫 Report / Banned WhatsApp</h3>
<input id="banNumber" placeholder="Reported WhatsApp Number">
<textarea id="banReason" placeholder="Violation details (auto-filled if empty)"></textarea>
<button onclick="banWA()">Open Gmail</button>
</div>

<script>
// ===== TIKTOK =====
function downloadTT(){
  const url = ttUrl.value.trim();
  if(!url.includes("tiktok.com")){
    ttResult.innerHTML="❌ Invalid TikTok URL";
    return;
  }
  const link=`https://ssstik.io/en?url=${encodeURIComponent(url)}`;
  ttResult.innerHTML=`
    <input value="${link}" readonly onclick="this.select()">
    <button onclick="navigator.clipboard.writeText('${link}')">📋 Copy</button>
  `;
}

// ===== YOUTUBE =====
function downloadYT(){
  const url = ytUrl.value.trim();
  if(!url.includes("youtube")){
    ytResult.innerHTML="❌ Invalid YouTube URL";
    return;
  }
  const link=`https://y2mate.nu/?url=${encodeURIComponent(url)}`;
  ytResult.innerHTML=`
    <input value="${link}" readonly onclick="this.select()">
    <button onclick="navigator.clipboard.writeText('${link}')">📋 Copy</button>
  `;
}

// ===== QR WITH LOGO =====
async function makeQR(){
  const canvas=qrCanvas;
  const ctx=canvas.getContext("2d");
  await QRCode.toCanvas(canvas,qrText.value,{width:300,margin:1});
  const logo=new Image();
  logo.crossOrigin="anonymous";
  logo.src="LOGO_KAMU.png"; // ganti sesuai logo
  logo.onload=()=>{
    const size=70;
    const x=(canvas.width-size)/2;
    const y=(canvas.height-size)/2;
    ctx.fillStyle="#fff";
    ctx.fillRect(x,y,size,size);
    ctx.drawImage(logo,x,y,size,size);
  }
}
function downloadQR(){
  const a=document.createElement("a");
  a.href=qrCanvas.toDataURL("image/png");
  a.download="qr_with_logo.png";
  a.click();
}

// ===== UNBANNED =====
function unbanWA(){
const name=unName.value;
const num=unNumber.value;
const body=
`My name is ${name}, and my WhatsApp account with the number ${num} has been banned.

I understand that my account may have violated WhatsApp's Terms of Service, but I sincerely want to comply with all rules moving forward.

I rely on this account for important communication, and I kindly request your review to restore access to my account.

Thank you very much for your time and consideration.

Sincerely,
${name}`;

location.href=`mailto:support@whatsapp.com?subject=WhatsApp Account Unban Request&body=${encodeURIComponent(body)}`;
}

// ===== BANNED =====
function banWA(){
const num=banNumber.value;
const reason=banReason.value || 
`This number has violated WhatsApp policies by sending inappropriate content, spam, or harmful material.

Please review this account thoroughly and take appropriate action to protect the WhatsApp community.`;

const body=
`I would like to formally report the WhatsApp number ${num}.

Reason:
${reason}

This account has engaged in activities that violate WhatsApp’s Terms of Service and community guidelines.

Thank you for your attention and action regarding this report.`;

location.href=`mailto:support@whatsapp.com?subject=WhatsApp Policy Violation Report&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
