<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>APK Builder Gratis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:420px;
  background:rgba(15,23,42,.85);
  backdrop-filter:blur(14px);
  padding:25px;
  border-radius:18px;
  color:#fff;
  box-shadow:0 25px 60px rgba(0,0,0,.4);
}
h1{
  text-align:center;
  margin-bottom:20px;
}
label{
  font-size:14px;
  margin-top:12px;
  display:block;
}
input,textarea,select{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:none;
  border-radius:10px;
  outline:none;
}
textarea{resize:none}
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
}
button:hover{opacity:.9}
.hidden{display:none}
.small{
  font-size:12px;
  opacity:.7;
  text-align:center;
  margin-top:15px;
}
</style>
</head>
<body>

<div class="card">
<h1>📱 APK Builder</h1>

<label>Nama Aplikasi</label>
<input id="appName" placeholder="Contoh: My APK">

<label>Icon APK</label>
<input type="file" id="icon" accept="image/*">

<label>Sumber Aplikasi</label>
<select id="source" onchange="toggleSource()">
  <option value="link">Link Website</option>
  <option value="html">HTML Sendiri</option>
</select>

<div id="linkBox">
  <label>Link Website</label>
  <input id="appLink" placeholder="https://example.com">
</div>

<div id="htmlBox" class="hidden">
  <label>Kode HTML</label>
  <textarea id="htmlCode" rows="4"></textarea>
</div>

<label>Link YouTube (Backsound)</label>
<input id="yt" placeholder="https://youtube.com/watch?v=xxxx">

<button onclick="build()">Buat APK</button>

<div class="small">
Gratis • Android • WebView APK
</div>
</div>

<script>
function toggleSource(){
  source.value==="html"
  ? htmlBox.classList.remove("hidden")
  : htmlBox.classList.add("hidden");
  source.value==="link"
  ? linkBox.classList.remove("hidden")
  : linkBox.classList.add("hidden");
}

function build(){
  const name=appName.value||"MyAPK";
  const src=source.value;
  const link=appLink.value;
  const html=htmlCode.value;
  const ytLink=yt.value;

  // Buat halaman app
  let page=`
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body,html{margin:0;padding:0;height:100%}
iframe{border:none;width:100%;height:100%}
</style>
</head>
<body>

<iframe src="${src==="link"?link:"data:text/html;base64,"+btoa(html)}"></iframe>

<iframe width="0" height="0"
src="https://www.youtube.com/embed/${getYT(ytLink)}?autoplay=1&loop=1&playlist=${getYT(ytLink)}"
allow="autoplay">
</iframe>

</body>
</html>`;

  download(page,`${name}.html`);

  alert(
`APK siap dibuat!

Langkah selanjutnya:
1. Upload file HTML ke WebView APK Builder
2. Pasang icon & nama APK
3. Download APK

Saya akan arahkan sekarang 🙂`
  );

  window.open("https://websitetoapk.com","_blank");
}

function getYT(url){
  const p=new URL(url).searchParams;
  return p.get("v")||"";
}

function download(data,name){
  const blob=new Blob([data],{type:"text/html"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}
</script>

</body>
</html>
