<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}
.header{background:linear-gradient(90deg,#4f46e5,#06b6d4);padding:15px;text-align:center;color:white;font-weight:bold;}
.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto;}

.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:10px;}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#020617;color:white;}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px;background:#4f46e5;color:white;}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.menu div{background:var(--card);padding:20px;text-align:center;border-radius:10px;cursor:pointer;}

.struk{background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;font-family:monospace;}
.line{border-bottom:1px dashed #aaa;margin:8px 0;}

.status{padding:4px;border-radius:5px;color:white;font-size:12px;}
.sukses{background:green}.pending{background:orange}.proses{background:blue}.gagal{background:red}
</style>
</head>

<body>

<div class="container">
<div class="header">K7N STORE</div>
<div class="content" id="app"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");
let db = JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK="https://discord.com/api/webhooks/1497806134692810943/giut3tk-1F64WHwCyas9p6fQcl5q3JCWpWlvhXc3A3yNKiQal6WWLXHfRedlwmcTVVVH";

const produk=[
{nama:"Follower Indo 100",harga:10500},
{nama:"Follower Global 100",harga:5000},
{nama:"Like TikTok 100",harga:800},
{nama:"Viewer 1000",harga:800}
];

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

/* DISCORD */
async function kirimDiscord(d){
await fetch(WEBHOOK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
content:"💸 Transaksi baru!",
embeds:[{
title:"STRUK BARU",
fields:[
{name:"ID",value:d.id},
{name:"Nama",value:d.nama},
{name:"Harga",value:"Rp "+d.harga},
{name:"Status",value:d.status}
]
}]
})
});
}

/* PAGE */
function page(p){

/* DASHBOARD */
if(p=="dashboard"){
let total=0;
db.forEach(x=>{if(x.status=="SUKSES")total+=Number(x.harga)});
app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 Rp ${total.toLocaleString("id-ID")}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
<div onclick="page('setting')">⚙️ Setting</div>
</div>`;
}

/* BUAT */
if(p=="buat"){
let opt=produk.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");
app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>

<h3>Buat Struk</h3>
<input id="nama" placeholder="Nama">

<select id="produk" onchange="isiHarga()">
<option value="">Pilih</option>
${opt}
<option value="custom">Custom</option>
</select>

<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>
<div id="hasil"></div>
</div>`;
}

/* AUTO HARGA */
window.isiHarga=function(){
let v=document.getElementById("produk").value;
if(v!=="custom" && v!==""){
document.getElementById("harga").value=produk[v].harga;
}
}

/* BUAT */
window.buat=function(){
let nama=document.getElementById("nama").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

if(!nama||!harga)return alert("Isi data!");

let id="K7N-"+Math.random().toString(36).substr(2,5);
let t=new Date().toISOString();

let obj={id,nama,harga,status,tanggal:t};
db.push(obj);save();

/* DISCORD */
kirimDiscord(obj);

/* STRUK */
hasil.innerHTML=`
<div id="strukBox" class="struk">
<h3>K7N STORE</h3>
<div class="line"></div>
<p>ID: ${id}</p>
<p>Nama: ${nama}</p>
<div class="line"></div>
<p>Harga: Rp ${Number(harga).toLocaleString("id-ID")}</p>
<div class="line"></div>
<p>Status: ${status}</p>
</div>

<button onclick="download()">Download</button>
<button onclick='wa(${JSON.stringify(obj)})'>WhatsApp</button>
`;
}

/* DOWNLOAD */
window.download=function(){
html2canvas(strukBox).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
window.wa=function(x){
let t=`ID:${x.id}\nNama:${x.nama}\nHarga:${x.harga}`;
window.open("https://wa.me/?text="+encodeURIComponent(t));
}

/* RIWAYAT */
if(p=="riwayat"){
let html=`<button onclick="page('dashboard')">⬅️ Kembali</button>`;
db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama}<br>
Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
${x.status}
<button onclick="edit(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});
app.innerHTML=html;
}

/* EDIT */
window.edit=function(i){
let x=db[i];
let nama=prompt("Nama",x.nama);
let harga=prompt("Harga",x.harga);
let status=prompt("Status",x.status);
if(!nama||!harga||!status)return;
db[i]={...x,nama,harga,status};
save();page("riwayat");
}

/* HAPUS */
window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);save();page("riwayat");
}
}

/* GRAFIK */
if(p=="grafik"){
let map={};
db.forEach(x=>{
if(x.status=="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
}
});
app.innerHTML=`<button onclick="page('dashboard')">⬅️</button><canvas id="c"></canvas>`;
setTimeout(()=>{
new Chart(c,{type:"line",data:{labels:Object.keys(map),datasets:[{data:Object.values(map),tension:0.3}]}})
},100);
}

/* SETTING */
if(p=="setting"){
let tema=localStorage.getItem("tema")||"#4f46e5";
let bg=localStorage.getItem("bg")||"#0f172a";

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅️ Kembali</button>

<h3>Setting</h3>

<label>Tema</label>
<input type="color" id="t" value="${tema}">

<label>Background</label>
<input type="color" id="b" value="${bg}">

<button onclick="saveTheme()">Simpan</button>
</div>`;
}

/* SAVE THEME */
window.saveTheme=function(){
let t=document.getElementById("t").value;
let b=document.getElementById("b").value;
localStorage.setItem("tema",t);
localStorage.setItem("bg",b);
document.documentElement.style.setProperty('--tema',t);
document.documentElement.style.setProperty('--bg',b);
alert("Disimpan!");
}

}

window.page=page;
page("dashboard");

});
</script>

</body>
</html>
