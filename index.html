<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Universal Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f172a;
  --card:#020617;
  --accent:#22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
  min-height:100vh;
}
.app{
  max-width:520px;
  margin:auto;
  padding:20px;
}
.card{
  background:rgba(2,6,23,.9);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}
h1{text-align:center}
input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:8px;
  outline:none;
}
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-top:12px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.result{
  margin-top:15px;
  font-size:14px;
}
.qr{
  display:flex;
  justify-content:center;
  margin-top:15px;
}
.hidden{display:none}
</style>
</head>
<body>

<div class="app">
<h1>⬇ Downloader & QR</h1>

<!-- DOWNLOADER -->
<div class="card">
<h3>🎥 Downloader</h3>
<input id="link" placeholder="Tempel link YouTube / TikTok">
<select id="type">
  <option value="video">Video</option>
  <option value="audio">Musik</option>
  <option value="thumbnail">Thumbnail</option>
</select>
<button onclick="download()">Proses</button>
<div class="result" id="downResult"></div>
</div>

<!-- QR GENERATOR -->
<div class="card">
<h3>🔳 QR Generator</h3>
<textarea id="qrText" placeholder="Link atau teks"></textarea>
<button onclick="makeQR()">Buat QR</button>
<div class="qr" id="qrBox"></div>
</div>
</div>

<script>
/* =====================
   PREVENT REFRESH
===================== */
window.addEventListener("keydown",e=>{
  if(e.key==="F5"||(e.ctrlKey&&e.key==="r")){
    e.preventDefault();
  }
});
window.onbeforeunload=()=>true;

/* =====================
   DOWNLOADER (API BASED)
===================== */
const API_URL="https://API-DOWNLOADER-KAMU.com/api"; // GANTI

async function download(){
  const link=document.getElementById("link").value;
  const type=document.getElementById("type").value;
  downResult.textContent="⏳ Memproses...";

  try{
    const res=await fetch(`${API_URL}?url=${encodeURIComponent(link)}&type=${type}`);
    const data=await res.json();

    downResult.innerHTML=`
      ✅ Berhasil<br>
      <a href="${data.download}" download style="color:#22c55e">
        Klik untuk download
      </a>
    `;
  }catch(e){
    downResult.textContent="❌ Gagal atau API belum tersedia";
  }
}

/* =====================
   QR GENERATOR
===================== */
function makeQR(){
  const text=qrText.value.trim();
  qrBox.innerHTML="";
  if(!text)return;
  const img=document.createElement("img");
  img.src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
  qrBox.appendChild(img);
}
</script>

</body>
</html>
