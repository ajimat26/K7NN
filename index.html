<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>
<script src="https://jsdelivr.net"></script>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
</style>
</head>
<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
// URL Firebase diperbaiki agar sesuai dengan nama sub-domain proyek Anda yang menggunakan double-dash (--)
const DB_URL = "https://firebasedatabase.app";
const WEBHOOK_STRUK = "https://discord.com";
const WEBHOOK_GRAFIK = "https://discord.com";

let db = [];
let statusKoneksi = "Menghubungkan...";

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

/* ================= AMBIL DATA DARI FIREBASE ================= */
async function muatDataDariCloud() {
  try {
    const respon = await fetch(DB_URL, { method: "GET", mode: "cors" });
    const data = await respon.json();
    db = [];
    if (data) {
      Object.keys(data).forEach(key => {
        if(data[key]) db.push({ firebaseKey: key, ...data[key] });
      });
    }
    statusKoneksi = "Online";
    // Jika user sedang di dashboard, perbarui angkanya secara langsung
    const txtOmset = document.getElementById("txt-omset");
    const txtTx = document.getElementById("txt-transaksi");
    if(txtOmset && txtTx) {
      let total = 0;
      db.forEach(x => { if(x.status === "SUKSES") total += Number(x.harga); });
      txtOmset.innerText = "💰 " + formatRp(total);
      txtTx.innerText = "📦 " + db.length + " transaksi";
    }
  } catch (error) {
    console.error(error);
    statusKoneksi = "Offline / Bermasalah";
  }
}

/* ================= HALAMAN DASHBOARD ================= */
function dashboard(){
  let total = 0;
  db.forEach(x => {
    if(x.status === "SUKSES") total += Number(x.harga);
  });

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>Dashboard (Cloud Bersama)</h3>
      <p id="txt-omset">💰 ${formatRp(total)}</p>
      <p id="txt-transaksi">📦 ${db.length} transaksi</p>
      <small style="color:#94a3b8">Status Server: ${statusKoneksi}</small>
    </div>

    <div class="menu">
      <div onclick="form()">📦 Buat</div>
      <div onclick="riwayat()">📊 Riwayat</div>
      <div onclick="grafik()">📈 Grafik</div>
      <div onclick="sendGrafik()">⏱ Kirim Grafik</div>
    </div>
  `;
}

/* ================= HALAMAN FORM INPUT ================= */
function form(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama">
      <input id="produk" placeholder="Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button onclick="buat()">Simpan</button>
      <div id="hasil"></div>
    </div>
  `;
}

/* ================= PROSES SIMPAN DATA ================= */
async function buat(){
  const nm = document.getElementById("nama").value;
  const pr = document.getElementById("produk").value;
  const hg = document.getElementById("harga").value;
  const st = document.getElementById("status").value;

  if(!nm || !pr || !hg) return alert("Semua data wajib diisi!");

  let obj = {
    id: "K7N-" + Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: nm,
    produk: pr,
    harga: Number(hg),
    status: st,
    tanggal: new Date().toISOString()
  };

  try {
    const respon = await fetch(DB_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj)
    });
    
    if(respon.ok) {
      sendStruk(obj);
      document.getElementById("hasil").innerHTML = `
        <div class="struk">
          <b>STRUK BERHASIL TERSIMPAN</b><br><br>
          ID: ${obj.id}<br>
          Nama: ${obj.nama}<br>
          Harga: ${formatRp(obj.harga)}
        </div>
      `;
      muatDataDariCloud();
    } else {
      alert("Gagal menyimpan ke Cloud. Pastikan Aturan (Rules) Firebase sudah di-set ke TRUE.");
    }
  } catch (e) {
    alert("Koneksi gagal: " + e.message);
  }
}

/* ================= HALAMAN RIWAYAT ================= */
function riwayat(){
  let html = `<button onclick="dashboard()">⬅ Kembali</button>`;

  if(db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada transaksi di cloud database.</p>`;
  } else {
    db.slice().reverse().forEach(x => {
      html += `
        <div class="card">
          <b>${x.id}</b><br>${x.nama} - ${x.produk}<br>${formatRp(x.harga)}<br>Status: <b>${x.status}</b><br><br>
          <button onclick="editData('${x.firebaseKey}')">Edit</button>
          <button onclick="hapusData('${x.firebaseKey}')" style="background:#ef4444; margin-top:5px;">Hapus</button>
        </div>
      `;
    });
  }
  document.getElementById("app").innerHTML = html;
}

async function editData(key) {
  const item = db.find(x => x.firebaseKey === key);
  let nama = prompt("Nama baru:", item.nama);
  let produk = prompt("Produk baru:", item.produk);
  let harga = prompt("Harga baru:", item.harga);
  let status = prompt("Status baru:", item.status);
  
  if(nama && produk && harga && status) {
    const urlEdit = `https://firebasedatabase.app{key}.json`;
    await fetch(urlEdit, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nama, produk, harga: Number(harga), status })
    });
    await muatDataDariCloud();
    riwayat();
  }
}

async function hapusData(key) {
  if(confirm("Hapus transaksi dari database cloud?")) {
    const urlHapus = `https://firebasedatabase.app{key}.json`;
    await fetch(urlHapus, { method: "DELETE" });
    await muatDataDariCloud();
    riwayat();
  }
}

/* ================= HALAMAN GRAFIK ================= */
function grafik(){
  let map = {};
  db.forEach(x => {
    if(x.status === "SUKSES") {
      let d = new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d] = (map[d] || 0) + Number(x.harga);
    }
  });

  document.getElementById("app").innerHTML = `<div class="card"><button onclick="dashboard()">⬅ Kembali</button><canvas id="chart"></canvas></div>`;

  setTimeout(() => {
    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: Object.keys(map),
        datasets: [{ label: 'Omset Sukses', data: Object.values(map), borderColor: "#4f46e5", tension: 0.4 }]
      }
    });
  }, 200);
}

/* ================= INTEGRASI DISCORD ================= */
async function sendStruk(x){
  try {
    await fetch(WEBHOOK_STRUK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ embeds: [{ title: "🧾 STRUK K7N STORE", fields: [{ name: "ID", value: x.id }, { name: "Nama", value: x.nama }, { name: "Harga", value: formatRp(x.harga) }] }] })
    });
  } catch(e){}
}

async function sendGrafik(){
  let map = {};
  db.forEach(x => {
    if(x.status === "SUKSES") {
      let d = new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d] = (map[d] || 0) + Number(x.harga);
    }
  });
  let keys = Object.keys(map);
  let values = Object.values(map);
  let total = values.reduce((a,b) => a+b, 0);
  let lines = keys.map((k,i) => `${k} → ${formatRp(values[i])}`).join("\n");

  try {
    await fetch(WEBHOOK_GRAFIK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        embeds: [{
          title: "📊 LAPORAN GRAFIK K7N STORE",
          description: "```" + lines + "```",
          fields: [
            { name: "TOTAL", value: formatRp(total), inline: true },
            { name: "TRANSAKSI", value: String(db.length), inline: true }
          ]
        }]
      })
    });
    alert("Grafik berhasil terkirim!");
  } catch(e){}
}

/* ================= JALANKAN APLIKASI ================= */
// Render menu utama terlebih dahulu agar tombol langsung aktif tanpa menunggu koneksi database
dashboard();
muatDataDariCloud();

// Auto sync database cloud di latar belakang setiap 4 detik sekali
setInterval(muatDataDariCloud, 4000);
</script>
</body>
</html>
