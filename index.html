<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
</style>
</head>
<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
// Menggunakan Webhook Discord Anda sebagai pusat penyimpanan data bersama
const WEBHOOK_STRUK = "https://discord.com";

// Menggunakan penyimpanan lokal sementara agar data tidak langsung hilang saat pindah menu
let db = JSON.parse(localStorage.getItem("k7n_temp_data")) || [];

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

function dashboard(){
  let total = 0;
  db.forEach(x => {
    if(x.status === "SUKSES") total += Number(x.harga);
  });

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>Dashboard K7N STORE</h3>
      <p>💰 Total Omset Sesi Ini: <b>${formatRp(total)}</b></p>
      <p>📦 Total Sesi Ini: <b>${db.length} transaksi</b></p>
      <p style="font-size: 12px; color: #a1a1aa; margin-top: 15px;">ℹ️ Riwayat lengkap dan hasil bersama tersimpan otomatis di <b>Channel Discord K7N STORE</b>.</p>
    </div>

    <div class="menu">
      <div onclick="form()">📦 Buat Transaksi</div>
      <div onclick="riwayat()">📊 Lihat Sesi Ini</div>
    </div>
  `;
}

function form(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama Pelanggan">
      <input id="produk" placeholder="Nama Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button onclick="buat()">Simpan & Kirim ke Discord</button>
      <div id="hasil"></div>
    </div>
  `;
}

async function buat(){
  const nm = document.getElementById("nama").value;
  const pr = document.getElementById("produk").value;
  const hg = document.getElementById("harga").value;
  const st = document.getElementById("status").value;

  if(!nm || !pr || !hg) return alert("Semua data wajib diisi!");

  let obj = {
    id: "K7N-" + Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: nm,
    produk: pr,
    harga: Number(hg),
    status: st,
    tanggal: new Date().toISOString()
  };

  // Simpan ke daftar sesi lokal agar bisa diintip sementara di menu riwayat
  db.push(obj);
  localStorage.setItem("k7n_temp_data", JSON.stringify(db));

  // Menampilkan struk sukses langsung di layar web tanpa hambatan
  document.getElementById("hasil").innerHTML = `
    <div class="struk">
      <b>🚀 TRANSAKSI BERHASIL</b><br><br>
      ID: ${obj.id}<br>
      Nama: ${obj.nama}<br>
      Produk: ${obj.produk}<br>
      Harga: ${formatRp(obj.harga)}<br>
      Status: ${obj.status}<br><br>
      <span style="color: green; font-weight: bold;">✓ Data terkirim ke riwayat Discord bersama!</span>
    </div>
  `;

  // Mengirim data ke Discord Webhook agar Anda dan teman Anda mendapatkan laporan konfirmasi secara real-time
  try {
    await fetch(WEBHOOK_STRUK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        embeds: [{
          title: "🧾 STRUK TRANSAKSI MASUK - K7N STORE",
          color: 5763719,
          fields: [
            { name: "ID TRANSAKSI", value: obj.id, inline: true },
            { name: "NAMA KASIR/PELANGGAN", value: obj.nama, inline: true },
            { name: "PRODUK", value: obj.produk, inline: true },
            { name: "HARGA", value: formatRp(obj.harga), inline: true },
            { name: "STATUS", value: obj.status, inline: true },
            { name: "WAKTU", value: new Date(obj.tanggal).toLocaleString("id-ID"), inline: false }
          ],
          footer: { text: "K7N Store Cloud Log System" }
        }]
      })
    });
  } catch(e) {
    console.log("Gagal mengirim notifikasi ke Discord");
  }
}

function riwayat(){
  let html = `<button onclick="dashboard()">⬅ Kembali</button><h3>Transaksi Sesi Ini</h3>`;

  if(db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada riwayat transaksi pada perangkat ini.</p>`;
  } else {
    db.slice().reverse().forEach((x, index) => {
      html += `
        <div class="card">
          <b>ID: ${x.id}</b><br>
          Pelanggan: ${x.nama}<br>
          Produk: ${x.produk}<br>
          Harga: ${formatRp(x.harga)}<br>
          Status: <b>${x.status}</b><br>
          <button onclick="hapusLokal(${db.length - 1 - index})" style="background: #ef4444; margin-top: 10px; padding: 5px 10px; font-size: 12px; width: auto;">Hapus dari Layar</button>
        </div>
      `;
    });
  }
  document.getElementById("app").innerHTML = html;
}

function hapusLokal(index) {
  db.splice(index, 1);
  localStorage.setItem("k7n_temp_data", JSON.stringify(db));
  riwayat();
}

// Menjalankan dashboard saat pertama kali dibuka
dashboard();
</script>
</body>
</html>
