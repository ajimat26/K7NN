<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
--main:#4f46e5;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
.header{padding:15px;text-align:center;background:var(--main);color:white;font-weight:bold}

.container{padding:15px}
.card{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px}

input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--main);color:white}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:var(--card);padding:15px;text-align:center;border-radius:10px;cursor:pointer}

.struk{background:white;color:black;padding:10px;border-radius:10px}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
const app=document.getElementById("app");
let db=JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK_STRUK="https://discord.com/api/webhooks/1497806134692810943/giut3tk-1F64WHwCyas9p6fQcl5q3JCWpWlvhXc3A3yNKiQal6WWLXHfRedlwmcTVVVH";
const WEBHOOK_GRAFIK="https://discord.com/api/webhooks/1497825833295806477/9avVXxaqYpdlCiR-Rwzgsnw8FeKW218LXMUt9K5BzsxHxVn7ccty8VP7cj2K5gDcQH9V";

function save(){
localStorage.setItem("k7n",JSON.stringify(db));
}

function formatRupiah(n){
return Number(n||0).toLocaleString("id-ID");
}

/* ================= STRUK DISCORD FIX ================= */
async function sendStruk(x){

const statusFix = x.status || "UNKNOWN";

await fetch(WEBHOOK_STRUK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE BOT",
embeds:[{
title:"🧾 TRANSAKSI K7N STORE",
color:5814783,
fields:[
{ name:"🆔 ID", value:x.id || "-", inline:true },
{ name:"👤 Nama", value:x.nama || "-", inline:true },
{ name:"📦 Produk", value:x.produk || "-", inline:false },
{ name:"💰 Harga", value:"Rp "+formatRupiah(x.harga), inline:true },
{ name:"📊 Status", value:statusFix, inline:true }
],
footer:{ text:"K7N STORE • "+new Date().toLocaleString("id-ID") }
}]
})
});
}

/* ================= GRAFIK DISCORD ================= */
async function sendGrafik(){

let map={}, total=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let d=new Date(x.tanggal).toLocaleDateString("id-ID");
map[d]=(map[d]||0)+Number(x.harga);
total+=Number(x.harga);
}
});

let keys=Object.keys(map);
let values=Object.values(map);

let max=Math.max(...values,1);
let h=6;

let msg="📊 LAPORAN GRAFIK K7N STORE\n━━━━━━━━━━━━━━\n";
msg+="💰 TOTAL: Rp "+formatRupiah(total)+"\n\n";
msg+="📈 PER HARI:\n\n";

for(let i=h;i>=1;i--){
let line="";
values.forEach(v=>{
let lv=Math.round((v/max)*h);
line+=lv>=i?" ███ ":"     ";
});
msg+=line+"\n";
}

msg+="──────────────\n";
msg+=keys.join(" ");

await fetch(WEBHOOK_GRAFIK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({content:msg})
});
}

setInterval(sendGrafik,3600000);

/* ================= DASHBOARD ================= */
function dashboard(){

let total=0;
db.forEach(x=>{
if(x.status==="SUKSES") total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 Rp ${formatRupiah(total)}</p>
<p>📦 ${db.length} Transaksi</p>
</div>

<div class="menu">
<div onclick="form()">📦 Buat</div>
<div onclick="riwayat()">📊 Riwayat</div>
<div onclick="grafik()">📈 Grafik</div>
<div onclick="sendGrafik()">⏱ Kirim Grafik</div>
</div>
`;
}

/* ================= FORM ================= */
function form(){
app.innerHTML=`
<div class="card">
<button onclick="dashboard()">⬅ Kembali</button>

<h3>Buat Struk</h3>

<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Produk">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>
<div id="hasil"></div>
</div>
`;
}

/* ================= BUAT ================= */
window.buat=function(){

let obj={
id:"K7N-"+Math.random().toString(36).slice(2,7),
nama:document.getElementById("nama").value,
produk:document.getElementById("produk").value,
harga:document.getElementById("harga").value,
status:document.getElementById("status").value,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

sendStruk(obj);

document.getElementById("hasil").innerHTML=`
<div class="struk">
<b>STRUK BERHASIL</b><br><br>
ID: ${obj.id}<br>
Nama: ${obj.nama}<br>
Produk: ${obj.produk}<br>
Harga: Rp ${formatRupiah(obj.harga)}<br>
Status: ${obj.status}
</div>
`;
}

/* ================= RIWAYAT ================= */
function riwayat(){

let html=`<button onclick="dashboard()">⬅ Kembali</button>`;

db.slice().reverse().forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
Rp ${formatRupiah(x.harga)}<br>
Status: ${x.status}<br>

<button onclick="edit(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>`;
});

app.innerHTML=html;
}

/* EDIT */
window.edit=function(i){
let x=db[i];

let nama=prompt("Nama",x.nama);
let produk=prompt("Produk",x.produk);
let harga=prompt("Harga",x.harga);
let status=prompt("Status",x.status);

db[i]={...x,nama,produk,harga,status};
save();
riwayat();
}

/* HAPUS */
window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);
save();
riwayat();
}
}

/* ================= GRAFIK WEB ================= */
function grafik(){

let map={};

db.forEach(x=>{
if(x.status==="SUKSES"){
let d=new Date(x.tanggal).toLocaleDateString("id-ID");
map[d]=(map[d]||0)+Number(x.harga);
}
});

app.innerHTML=`
<div class="card">
<button onclick="dashboard()">⬅ Kembali</button>
<h3>Grafik Web</h3>
<canvas id="c"></canvas>
</div>
`;

setTimeout(()=>{
new Chart(document.getElementById("c"),{
type:"line",
data:{
labels:Object.keys(map),
datasets:[{data:Object.values(map),borderColor:"#4f46e5",tension:0.3}]
}
});
},200);
}

/* START */
dashboard();
</script>

</body>
</html>
