<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;font-weight:bold;color:white}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white}
button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}
.struk{background:white;color:black;padding:10px;border-radius:10px;font-family:monospace;margin-top:10px}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
const app=document.getElementById("app");

// Memuat data lama yang sudah tersimpan di browser agar tidak hilang saat direfresh
let db=JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK_STRUK="https://discord.com/api/webhooks/1497806134692810943/giut3tk-1F64WHwCyas9p6fQcl5q3JCWpWlvhXc3A3yNKiQal6WWLXHfRedlwmcTVVVH";
const WEBHOOK_GRAFIK="https://discord.com/api/webhooks/1497825833295806477/9avVXxaqYpdlCiR-Rwzgsnw8FeKW218LXMUt9K5BzsxHxVn7ccty8VP7cj2K5gDcQH9V";

function save(){
  localStorage.setItem("k7n",JSON.stringify(db));
}

function formatRp(v){
  return "Rp "+Number(v).toLocaleString("id-ID");
}

/* ================= DISCORD STRUK ================= */
async function sendStruk(x){
  try {
    await fetch(WEBHOOK_STRUK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        embeds:[{
          title:"🧾 STRUK TRANSAKSI K7N STORE",
          color:5763719,
          fields:[
            {name:"ID",value:x.id,inline:true},
            {name:"Nama",value:x.nama,inline:true},
            {name:"Produk",value:x.produk,inline:true},
            {name:"Harga",value:formatRp(x.harga),inline:true},
            {name:"Status",value:x.status,inline:true},
            {name:"Waktu",value:new Date(x.tanggal).toLocaleString("id-ID"),inline:false}
          ],
          footer:{text:"K7N STORE SYSTEM"}
        }]
      })
    });
  } catch(e) {}
}

/* ================= DISCORD GRAFIK EMBED ================= */
async function sendGrafik(){
  if(db.length === 0) return;
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });

  let keys=Object.keys(map);
  let values=Object.values(map);
  if(keys.length === 0) return;

  let total=values.reduce((a,b)=>a+b,0);
  let lines=keys.map((k,i)=>{
    return `${k} → ${formatRp(values[i])}`;
  }).join("\n");

  try {
    await fetch(WEBHOOK_GRAFIK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        embeds:[{
          title:"📊 LAPORAN GRAFIK K7N STORE",
          color:3447003,
          description: "```"+lines+"```",
          fields:[
            {name:"TOTAL",value:formatRp(total),inline:true},
            {name:"TRANSAKSI",value:String(db.length),inline:true}
          ],
          footer:{text:"Auto Report System"}
        }]
      })
    });
  } catch(e) {}
}

/* AUTO 1 JAM */
setInterval(sendGrafik,3600000);

/* ================= DASHBOARD ================= */
function dashboard(){
  let total=0;
  db.forEach(x=>{
    if(x.status==="SUKSES") total+=Number(x.harga);
  });

  app.innerHTML=`
    <div class="card">
      <h3>Dashboard</h3>
      <p>💰 ${formatRp(total)}</p>
      <p>📦 ${db.length} transaksi</p>
    </div>

    <div class="menu">
      <div onclick="form()">📦 Buat</div>
      <div onclick="riwayat()">📊 Riwayat</div>
      <div onclick="grafik()">📈 Grafik</div>
      <div onclick="sendGrafik()">⏱ Kirim Grafik</div>
    </div>
  `;
}

/* ================= FORM ================= */
function form(){
  app.innerHTML=`
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <h3>Tambah Transaksi</h3>
      <input id="nama" placeholder="Nama">
      <input id="produk" placeholder="Produk">
      <input id="harga" type="number" placeholder="Harga">
      <select id="status">
        <option value="SUKSES">SUKSES</option>
        <option value="PENDING">PENDING</option>
        <option value="PROSES">PROSES</option>
        <option value="GAGAL">GAGAL</option>
      </select>
      <button onclick="buat()">Simpan</button>
      <div id="hasil"></div>
    </div>
  `;
}

/* ================= BUAT ================= */
window.buat=function(){
  const namaInput = document.getElementById("nama").value;
  const produkInput = document.getElementById("produk").value;
  const hargaInput = document.getElementById("harga").value;
  const statusInput = document.getElementById("status").value;

  if(!namaInput || !produkInput || !hargaInput) {
    return alert("Semua data wajib diisi!");
  }

  let obj={
    id:"K7N-"+Math.random().toString(36).slice(2,7).toUpperCase(),
    nama: namaInput,
    produk: produkInput,
    harga: Number(hargaInput),
    status: statusInput || "PENDING",
    tanggal: new Date().toISOString()
  };

  db.push(obj);
  save(); // Data aman disimpan ke memori internal web
  sendStruk(obj);

  document.getElementById("hasil").innerHTML=`
    <div class="struk">
      <b>STRUK BERHASIL</b><br><br>
      ID:${obj.id}<br>
      Nama:${obj.nama}<br>
      Produk:${obj.produk}<br>
      Harga:${formatRp(obj.harga)}<br>
      Status:${obj.status}
    </div>
  `;
}

/* ================= RIWAYAT (SUDAH FIXED DATA TERBALIK) ================= */
function riwayat(){
  let html=`<button onclick="dashboard()">⬅ Kembali</button><h3>Riwayat Transaksi</h3>`;

  if(db.length === 0) {
    html += `<p style="text-align:center; margin-top:20px;">Belum ada riwayat transaksi.</p>`;
  } else {
    // Memetakan indeks asli array agar fitur edit/hapus tidak salah membaca data saat dibalik
    db.map((x, idx) => ({ ...x, originalIndex: idx }))
      .reverse()
      .forEach((x)=>{
        html+=`
          <div class="card">
            <b>ID: ${x.id}</b><br>
            ${x.nama} - ${x.produk}<br>
            ${formatRp(x.harga)}<br>
            Status: <b>${x.status}</b><br><br>
            <button onclick="edit(${x.originalIndex})" style="width:auto; padding:5px 15px;">Edit</button>
            <button onclick="hapus(${x.originalIndex})" style="width:auto; padding:5px 15px; background:#ef4444;">Hapus</button>
          </div>
        `;
      });
  }

  app.innerHTML=html;
}

window.edit=function(i){
  let x=db[i];

  let nama=prompt("Ubah Nama:", x.nama);
  let produk=prompt("Ubah Produk:", x.produk);
  let harga=prompt("Ubah Harga:", x.harga);
  let status=prompt("Ubah Status (SUKSES/PENDING/PROSES/GAGAL):", x.status);

  if(nama && produk && harga && status) {
    db[i]={...x, nama, produk, harga: Number(harga), status: status.toUpperCase()};
    save();
    riwayat();
  }
}

window.hapus=function(i){
  if(confirm("Apakah Anda yakin ingin menghapus transaksi ini?")) {
    db.splice(i,1);
    save();
    riwayat();
  }
}

/* ================= GRAFIK WEB ================= */
function grafik(){
  let map={};
  db.forEach(x=>{
    if(x.status==="SUKSES"){
      let d=new Date(x.tanggal).toLocaleDateString("id-ID");
      map[d]=(map[d]||0)+Number(x.harga);
    }
  });

  app.innerHTML=`
    <div class="card">
      <button onclick="dashboard()">⬅ Kembali</button>
      <canvas id="chart"></canvas>
    </div>
  `;

  setTimeout(()=>{
    new Chart(document.getElementById("chart"),{
      type:"line",
      data:{
        labels:Object.keys(map),
        datasets:[{
          label: 'Omset Sukses',
          data:Object.values(map),
          borderColor:"#4f46e5",
          tension:0.4
        }]
      }
    });
  },200);
}

// Inisialisasi awal program
dashboard();
</script>

</body>
</html>
