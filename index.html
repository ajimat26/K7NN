<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;}

.header{
background:linear-gradient(90deg,#4f46e5,#06b6d4);
padding:15px;
text-align:center;
font-weight:bold;
color:white;
}

.container{padding:15px;}

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:8px;
background:#22d3ee;
color:black;
font-weight:bold;
cursor:pointer;
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.menu div{
background:#1e293b;
padding:15px;
text-align:center;
border-radius:10px;
cursor:pointer;
}

.struk{
background:white;
color:black;
padding:10px;
border-radius:10px;
font-family:monospace;
}

.line{border-bottom:1px dashed #aaa;margin:8px 0;}

.status{padding:3px 6px;border-radius:5px;color:white;}
.sukses{background:green;}
.pending{background:orange;}
.proses{background:blue;}
.gagal{background:red;}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
let app=document.getElementById("app");

let db=JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK_STRUK="WEBHOOK_STRUK_KAMU";
const WEBHOOK_GRAFIK="WEBHOOK_GRAFIK_KAMU";

/* SAVE */
function save(){
localStorage.setItem("k7n",JSON.stringify(db));
}

/* FORMAT RUPIAH */
function rp(x){
return "Rp "+Number(x).toLocaleString("id-ID");
}

/* NAV */
function page(p){

/* DASHBOARD */
if(p=="dashboard"){
let total=0;

db.forEach(x=>{
if(x.status==="SUKSES") total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 ${rp(total)}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="page('buat')">📦 Buat Struk</div>
<div onclick="page('riwayat')">📊 Riwayat</div>
<div onclick="page('grafik')">📈 Grafik</div>
<div onclick="page('setting')">⚙️ Setting</div>
</div>
`;
}

/* BUAT STRUK */
if(p=="buat"){

let opt=db.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");

app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅ Kembali</button>

<h3>Buat Struk</h3>

<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Nama Produk">

<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>

<div id="hasil"></div>
</div>
`;
}

/* BUAT */
window.buat=function(){

let nama=document.getElementById("nama").value;
let produk=document.getElementById("produk").value;
let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

if(!nama||!produk||!harga)return alert("Isi lengkap!");

let id="K7N-"+Math.random().toString(36).substr(2,5);
let t=new Date().toISOString();

let obj={id,nama,produk,harga,status,tanggal:t};

db.push(obj);
save();

/* STRUK */
document.getElementById("hasil").innerHTML=`
<div id="strukBox" class="struk">
<h3>K7N STORE</h3>
<div class="line"></div>

ID: ${id}<br>
Nama: ${nama}<br>
Produk: ${produk}<br>

<div class="line"></div>

Harga: ${rp(harga)}<br>
Status: ${status}<br>
</div>

<button onclick="download()">Download</button>
<button onclick="sendStruk(${db.length-1})">Kirim WA</button>
`;

}

/* DOWNLOAD */
window.download=function(){
html2canvas(document.getElementById("strukBox")).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="struk.png";
a.click();
});
}

/* WA */
window.sendStruk=function(i){
let x=db[i];
let text=`ID:${x.id}\nProduk:${x.produk}\nHarga:${x.harga}`;
window.open("https://wa.me/?text="+encodeURIComponent(text));
}

/* RIWAYAT */
if(p=="riwayat"){
let html=`<button onclick="page('dashboard')">⬅</button>`;

db.forEach((x,i)=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
${rp(x.harga)}<br>
${x.status}<br>

<button onclick="edit(${i})">Edit</button>
<button onclick="hapus(${i})">Hapus</button>
</div>
`;
});

app.innerHTML=html;
}

/* EDIT */
window.edit=function(i){
let x=db[i];

let nama=prompt("Nama",x.nama);
let produk=prompt("Produk",x.produk);
let harga=prompt("Harga",x.harga);
let status=prompt("Status",x.status);

db[i]={...x,nama,produk,harga,status};
save();
page("riwayat");
}

/* HAPUS */
window.hapus=function(i){
if(confirm("Hapus?")){
db.splice(i,1);
save();
page("riwayat");
}
}

/* GRAFIK */
if(p=="grafik"){

let map={}, total=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
}
});

app.innerHTML=`
<button onclick="page('dashboard')">⬅</button>
<canvas id="chart"></canvas>

<button onclick="sendGrafik()">Kirim Grafik Discord</button>
`;

setTimeout(()=>{

window.myChart=new Chart(chart,{
type:"bar",
data:{
labels:Object.keys(map),
datasets:[{
data:Object.values(map),
backgroundColor:"#22d3ee"
}]
},
options:{
plugins:{legend:{display:false}}
}
});

},300);
}

/* KIRIM GRAFIK */
window.sendGrafik=function(){

html2canvas(document.getElementById("chart")).then(img=>{

fetch(WEBHOOK_GRAFIK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"K7N STORE",
content:"📊 GRAFIK PENJUALAN",
embeds:[{
image:{url:img.toDataURL()}
}]
})
});

});

}

/* SETTING */
if(p=="setting"){
app.innerHTML=`
<div class="card">
<button onclick="page('dashboard')">⬅</button>
<h3>Setting</h3>
<p>Coming soon...</p>
</div>
`;
}

}

window.page=page;
page("dashboard");
</script>

</body>
</html>
