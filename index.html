<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N STORE PRO FIX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
.header{padding:15px;text-align:center;background:#4f46e5;color:#fff;font-weight:bold}
.container{padding:15px}

.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}

input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}

button{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.menu div{background:#1e293b;padding:20px;text-align:center;border-radius:10px;cursor:pointer}

.struk{background:#fff;color:#000;padding:10px;border-radius:10px;font-family:monospace}
</style>
</head>

<body>

<div class="header">K7N STORE</div>
<div class="container" id="app"></div>

<script>
const app=document.getElementById("app");
let db=JSON.parse(localStorage.getItem("k7n"))||[];

const WEBHOOK_STRUK="https://discord.com/api/webhooks/1497806134692810943/giut3tk-1F64WHwCyas9p6fQcl5q3JCWpWlvhXc3A3yNKiQal6WWLXHfRedlwmcTVVVH";
const WEBHOOK_GRAFIK="https://discord.com/api/webhooks/1497825833295806477/9avVXxaqYpdlCiR-Rwzgsnw8FeKW218LXMUt9K5BzsxHxVn7ccty8VP7cj2K5gDcQH9V";

function save(){localStorage.setItem("k7n",JSON.stringify(db));}

/* ================= DISCORD STRUK ================= */
async function kirimStruk(x){
await fetch(WEBHOOK_STRUK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
content:`🧾 STRUK K7N
ID:${x.id}
Nama:${x.nama}
Produk:${x.produk}
Harga:Rp ${Number(x.harga).toLocaleString("id-ID")}
Status:${x.status}`
})
});
}

/* ================= GRAFIK ASCII ================= */
async function kirimGrafik(){

let map={}, total=0;

db.forEach(x=>{
if(x.status==="SUKSES"){
let t=new Date(x.tanggal).toLocaleDateString("id-ID");
map[t]=(map[t]||0)+Number(x.harga);
total+=Number(x.harga);
}
});

let keys=Object.keys(map);
let values=Object.values(map);

let max=Math.max(...values,1);

let msg="📊 GRAFIK K7N STORE\n━━━━━━━━━━\n";
msg+="TOTAL: Rp "+total.toLocaleString("id-ID")+"\n\n";

for(let i=5;i>=1;i--){
let line="";
values.forEach(v=>{
let h=Math.round((v/max)*5);
line+=h>=i?" ███ ":"     ";
});
msg+=line+"\n";
}

msg+="────────────\n";
msg+=keys.join(" ");

await fetch(WEBHOOK_GRAFIK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({content:msg})
});
}

/* AUTO 1 JAM */
setInterval(()=>{kirimGrafik()},3600000);

/* ================= DASHBOARD ================= */
function dashboard(){

let total=0;
db.forEach(x=>{
if(x.status==="SUKSES") total+=Number(x.harga);
});

app.innerHTML=`
<div class="card">
<h3>Dashboard</h3>
<p>💰 Rp ${total.toLocaleString("id-ID")}</p>
<p>📦 ${db.length} transaksi</p>
</div>

<div class="menu">
<div onclick="form()">📦 Buat</div>
<div onclick="riwayat()">📊 Riwayat</div>
<div onclick="grafik()">📈 Grafik</div>
<div onclick="kirimGrafik()">⏱ Kirim Grafik</div>
</div>
`;
}

/* ================= FORM ================= */
function form(){
app.innerHTML=`
<div class="card">
<button onclick="dashboard()">⬅ Kembali</button>

<h3>Buat Struk</h3>
<input id="nama" placeholder="Nama">
<input id="produk" placeholder="Produk">
<input id="harga" placeholder="Harga">

<select id="status">
<option>SUKSES</option>
<option>PENDING</option>
<option>PROSES</option>
<option>GAGAL</option>
</select>

<button onclick="buat()">Buat</button>

<div id="hasil"></div>
</div>
`;
}

/* ================= BUAT ================= */
window.buat=function(){

let obj={
id:"K7N-"+Math.random().toString(36).slice(2,7),
nama:nama.value,
produk:produk.value,
harga:harga.value,
status:status.value,
tanggal:new Date().toISOString()
};

db.push(obj);
save();

kirimStruk(obj);

hasil.innerHTML=`
<div class="struk">
<b>STRUK</b><br><br>
ID:${obj.id}<br>
Nama:${obj.nama}<br>
Produk:${obj.produk}<br>
Harga:Rp ${Number(obj.harga).toLocaleString("id-ID")}<br>
Status:${obj.status}
</div>
`;
}

/* ================= RIWAYAT ================= */
function riwayat(){
let html=`<button onclick="dashboard()">⬅ Kembali</button>`;
db.slice().reverse().forEach(x=>{
html+=`
<div class="card">
<b>${x.id}</b><br>
${x.nama} - ${x.produk}<br>
Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
${x.status}
</div>`;
});
app.innerHTML=html;
}

/* ================= GRAFIK ================= */
function grafik(){
app.innerHTML=`
<div class="card">
<button onclick="dashboard()">⬅ Kembali</button>
<h3>Grafik</h3>
<p>Gunakan tombol kirim ke Discord</p>
</div>`;
}

dashboard();
</script>

</body>
</html>
