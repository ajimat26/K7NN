<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>k7n App Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);
  color:#fff;
}
.container{
  max-width:500px;
  margin:40px auto;
  background:#111827;
  border-radius:16px;
  padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
h1{
  text-align:center;
  margin-bottom:20px;
}
label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}
input, textarea, select{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
}
textarea{resize:vertical;}
button{
  width:100%;
  margin-top:25px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
.hidden{display:none}
.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  opacity:.7;
}
</style>
</head>
<body>

<div class="container">
<h1>🚀 Free App Builder</h1>

<label>Nama Aplikasi</label>
<input id="appName" placeholder="Contoh: MyApp">

<label>Sumber Aplikasi</label>
<select id="sourceType" onchange="toggleSource()">
  <option value="link">Dari Link Website</option>
  <option value="html">HTML Sendiri</option>
</select>

<div id="linkBox">
  <label>Link Website</label>
  <input id="appLink" placeholder="https://example.com">
</div>

<div id="htmlBox" class="hidden">
  <label>Kode HTML</label>
  <textarea id="htmlCode" rows="6" placeholder="<h1>Hello App</h1>"></textarea>
</div>

<label>Warna Tema</label>
<input type="color" id="themeColor" value="#22c55e">

<button onclick="buildApp()">Buat Aplikasi & Download</button>

<div class="footer">
  Gratis • Tanpa Login • Client Side
</div>
</div>

<script>
function toggleSource(){
  const type=document.getElementById("sourceType").value;
  document.getElementById("linkBox").classList.toggle("hidden",type!=="link");
  document.getElementById("htmlBox").classList.toggle("hidden",type!=="html");
}

function buildApp(){
  const name=document.getElementById("appName").value || "MyApp";
  const type=document.getElementById("sourceType").value;
  const link=document.getElementById("appLink").value;
  const html=document.getElementById("htmlCode").value;
  const color=document.getElementById("themeColor").value;

  let content="";
  if(type==="link"){
    content=`<!DOCTYPE html>
<html>
<head>
<title>${name}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0">
<iframe src="${link}" style="border:none;width:100vw;height:100vh;"></iframe>
</body>
</html>`;
  }else{
    content=`<!DOCTYPE html>
<html>
<head>
<title>${name}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:${color};color:white;">
${html}
</body>
</html>`;
  }

  const zip=new Blob([content],{type:"text/html"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(zip);
  a.download=name+".html";
  a.click();

  alert("Aplikasi berhasil dibuat!\nSilakan download dan gunakan.");
}
</script>

</body>
</html>
