<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>K7N Cyber Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#020617;
color:#e5e7eb;
}
header{text-align:center;padding:20px}
header h2{color:#22d3ee}
.card{
background:#020617;
border:1px solid #1e293b;
border-radius:18px;
padding:16px;
margin:12px;
}
h3{color:#a855f7}
input,select{
width:100%;
padding:11px;
margin-top:8px;
background:#000;
border:1px solid #334155;
border-radius:12px;
color:#fff;
}
button{
width:100%;
margin-top:12px;
padding:13px;
border:none;
border-radius:14px;
font-weight:bold;
background:linear-gradient(90deg,#22d3ee,#22c55e);
cursor:pointer;
}
canvas{display:block;margin:10px auto}
</style>
</head>

<body>

<header>
<h2>K7N CYBER TOOLS</h2>
</header>

<!-- QR GENERATOR -->
<div class="card">
<h3>🔳 QR Generator</h3>

<select id="qrType" onchange="toggleQR()">
<option value="text">Text / Link</option>
<option value="image">Gambar (Upload)</option>
</select>

<input id="qrText" placeholder="Text / Link">
<input id="qrImg" type="file" accept="image/*" style="display:none">

<button onclick="makeQR()">Generate QR</button>
<canvas id="qr" width="300" height="300"></canvas>
<button onclick="saveQR()">Download QR</button>
</div>

<script>
function toggleQR(){
qrText.style.display = qrType.value==="image"?"none":"block";
qrImg.style.display  = qrType.value==="image"?"block":"none";
}

function makeQR(){

const SIZE = 300;

const drawQR = (data)=>{
QRCode.toCanvas(qr,data,{
width:SIZE,
errorCorrectionLevel:'H'
},()=>{
const c = qr.getContext("2d");
const center = SIZE / 2;

/* === STEP 1: LUBANGI QR SESUAI HURUF K7N === */
c.save();
c.translate(center, center);
c.rotate(-0.35);

c.globalCompositeOperation = "destination-out";
c.font = "bold 30px Arial Black";
c.textAlign = "center";
c.textBaseline = "middle";
c.fillText("K7N", 0, 0);

c.restore();

/* === STEP 2: GAMBAR TEKS K7N DI ATASNYA === */
c.save();
c.translate(center, center);
c.rotate(-0.35);

c.globalCompositeOperation = "source-over";

/* outline */
c.lineWidth = 3;
c.strokeStyle = "#0f172a";
c.font = "bold 30px Arial Black";
c.textAlign = "center";
c.textBaseline = "middle";
c.strokeText("K7N", 0, 0);

/* gradient isi */
const grad = c.createLinearGradient(-30,0,30,0);
grad.addColorStop(0,"#22d3ee");
grad.addColorStop(1,"#22c55e");
c.fillStyle = grad;
c.fillText("K7N", 0, 0);

c.restore();
});
};

if(qrType.value==="image" && qrImg.files[0]){
const r = new FileReader();
r.onload = e => drawQR(e.target.result);
r.readAsDataURL(qrImg.files[0]);
}else{
drawQR(qrText.value);
}
}

function saveQR(){
const a=document.createElement("a");
a.href=qr.toDataURL("image/png");
a.download="K7N_QR.png";
a.click();
}
</script>

</body>
</html>
