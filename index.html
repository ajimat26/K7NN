<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>KZN Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:linear-gradient(135deg,#8b0000,#000);
  color:#fff;
  overflow:hidden;
}
.app{
  max-width:420px;
  margin:auto;
  padding:20px;
  animation:fadeIn 0.8s ease;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1}}

h1{
  text-align:center;
  color:#ff3b3b;
  text-shadow:0 0 15px #ff3b3b;
}

.tabs{
  display:flex;
  gap:6px;
}
.tabs button{
  flex:1;
  padding:10px;
  background:#111;
  border:none;
  color:#fff;
  border-radius:8px;
  transition:.3s;
}
.tabs button:hover{
  background:#ff2a2a;
  box-shadow:0 0 10px #ff2a2a;
}

.tab{
  display:none;
  margin-top:15px;
  animation:slideUp .5s ease;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
}

button.action{
  width:100%;
  padding:12px;
  border-radius:8px;
  background:#ff2a2a;
  border:none;
  color:#fff;
  position:relative;
  overflow:hidden;
  transition:.3s;
}
button.action:hover{
  box-shadow:0 0 15px #ff2a2a;
  transform:scale(1.03);
}
button.action::after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.4);
  width:10px;height:10px;
  border-radius:50%;
  transform:scale(0);
  animation:ripple .6s linear;
}
@keyframes ripple{
  to{transform:scale(20);opacity:0}
}

canvas{
  width:100%;
  margin-top:10px;
  border-radius:10px;
  background:#fff;
  animation:zoom .4s ease;
}
@keyframes zoom{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

.loading{
  text-align:center;
  margin-top:10px;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{opacity:.4}50%{opacity:1}100%{opacity:.4}
}
</style>
</head>

<body>
<div class="app">
<h1>KZN TOOLS</h1>

<div class="tabs">
  <button onclick="openTab('dl')">Downloader</button>
  <button onclick="openTab('qr')">QR</button>
  <button onclick="openTab('unban')">Unban WA</button>
  <button onclick="openTab('report')">Report WA</button>
</div>

<div id="dl" class="tab">
  <input id="dlUrl" placeholder="Paste link TikTok / YouTube">
  <button class="action" onclick="download()">Download</button>
  <div id="loading" class="loading" style="display:none">Memproses...</div>
</div>

<div id="qr" class="tab">
  <input id="qrText" placeholder="Teks / Link">
  <button class="action" onclick="makeQR()">Buat QR</button>
  <canvas id="qrCanvas"></canvas>
</div>

<div id="unban" class="tab">
  <input id="unName" placeholder="Nama">
  <input id="unNum" placeholder="Nomor WhatsApp +62">
  <button class="action" onclick="unban()">Ajukan Unban</button>
</div>

<div id="report" class="tab">
  <input id="repName" placeholder="Nama Pelapor">
  <input id="repNum" placeholder="Nomor Target">
  <button class="action" onclick="report()">Laporkan</button>
</div>

</div>

<script>
function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.getElementById(id).style.display='block';
}
openTab('dl');

// DOWNLOAD
function download(){
  const u=dlUrl.value;
  if(!u) return alert("Masukkan link!");
  loading.style.display="block";
  setTimeout(()=>{
    if(u.includes("tiktok")){
      location.href="https://ssstik.io/id?url="+encodeURIComponent(u);
    }else if(u.includes("youtube")||u.includes("youtu.be")){
      location.href="https://v6.www-y2mate.com/youtube/"+encodeURIComponent(u);
    }else{
      alert("Link tidak didukung");
    }
    loading.style.display="none";
  },1200);
}

// QR
function makeQR(){
  const t=qrText.value;
  const c=qrCanvas;
  const ctx=c.getContext("2d");
  const qr=new Image();
  qr.src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(t);
  qr.onload=()=>{
    c.width=300;c.height=300;
    ctx.drawImage(qr,0,0);
    const logo=new Image();
    logo.src="logo.png";
    logo.onload=()=>ctx.drawImage(logo,110,110,80,80);
  }
}

// UNBAN
function unban(){
  const msg=`Dear WhatsApp Support Team,

I respectfully request a review of my WhatsApp account.

Name: ${unName.value}
Phone Number: ${unNum.value}

I sincerely apologize for any unintentional violation.

Best regards,
${unName.value}`;
  location.href=`mailto:support@whatsapp.com?subject=WhatsApp Account Review&body=${encodeURIComponent(msg)}`;
}

// REPORT
function report(){
  const msg=`Dear WhatsApp Support Team,

I would like to report a WhatsApp account violating policies.

Reported Number: ${repNum.value}

Thank you.

Sincerely,
${repName.value}`;
  location.href=`mailto:support@whatsapp.com?subject=WhatsApp Policy Violation&body=${encodeURIComponent(msg)}`;
}

// DISABLE REFRESH
window.addEventListener("keydown",e=>{
  if(e.key==="F5"||(e.ctrlKey&&e.key==="r")) e.preventDefault();
});
</script>
</body>
</html>
