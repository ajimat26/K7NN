<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>All-in-One Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- QR LIB -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Poppins, sans-serif;
}

body {
  background: #0f172a;
  color: #fff;
  overflow: hidden;
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg,#0ea5e9,#1e293b);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

#splash img {
  width: 120px;
  border-radius: 20px;
  animation: pop 1.5s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

.loader {
  margin-top: 20px;
  width: 40px;
  height: 40px;
  border: 4px solid #fff;
  border-top: 4px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* APP */
#app {
  display: none;
  padding: 20px;
  height: 100vh;
  overflow-y: auto;
}

.card {
  background: #020617;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

input, select, button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-top: 10px;
}

button {
  background: #0ea5e9;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

#qr {
  position: relative;
  margin-top: 15px;
  display: flex;
  justify-content: center;
}

#qr img.logo {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 10px;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img src="https://i.supaimg.com/9775bd8b-667c-4ea3-8173-b27aeee837bc.jpg">
  <div class="loader"></div>
  <p style="margin-top:10px">Memuat aplikasi...</p>
</div>

<!-- APP -->
<div id="app">

  <!-- DOWNLOADER -->
  <div class="card">
    <h3>Downloader YT / TikTok</h3>
    <input id="url" placeholder="Masukkan URL">
    <select id="type">
      <option value="mp4">MP4</option>
      <option value="mp3">MP3</option>
    </select>
    <button onclick="download()">Download</button>
    <p id="result"></p>
  </div>

  <!-- QR -->
  <div class="card">
    <h3>QR Generator</h3>
    <input id="qrtext" placeholder="Teks / Link">
    <button onclick="makeQR()">Buat QR</button>

    <div id="qr"></div>

    <button onclick="downloadQR()">Download QR</button>
  </div>

</div>

<script>
/* SPLASH CONTROL */
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.body.style.overflow = "auto";
}, 2500);

/* DOWNLOAD */
async function download() {
  const url = document.getElementById("url").value;
  const type = document.getElementById("type").value;
  const res = document.getElementById("result");

  res.innerHTML = "⏳ Memproses...";

  const r = await fetch("http://localhost:3000/api/download", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url, type })
  });

  const j = await r.json();

  if (j.status) {
    res.innerHTML = `<a href="${j.download_url}" target="_blank">⬇ Download Sekarang</a>`;
  } else {
    res.innerHTML = j.message;
  }
}

/* QR */
let qr;
function makeQR() {
  document.getElementById("qr").innerHTML = "";
  qr = new QRCode("qr", {
    text: document.getElementById("qrtext").value,
    width: 220,
    height: 220
  });

  setTimeout(() => {
    const img = document.createElement("img");
    img.src = "https://i.supaimg.com/9775bd8b-667c-4ea3-8173-b27aeee837bc.jpg";
    img.className = "logo";
    document.getElementById("qr").appendChild(img);
  }, 300);
}

function downloadQR() {
  const canvas = document.querySelector("#qr canvas");
  const a = document.createElement("a");
  a.href = canvas.toDataURL();
  a.download = "qr.png";
  a.click();
}
</script>

</body>
</html>
