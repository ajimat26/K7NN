<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE PRO</title>

<!-- html2canvas dipertahankan untuk fitur download gambar struk -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--tema:#4f46e5;
--bg:#0f172a;
--card:#1e293b;
--text:#e5e7eb;
--accent:#22d3ee;
}

body{margin:0;font-family:Arial, sans-serif;background:var(--bg);color:var(--text);}

.header{
background:linear-gradient(90deg,#4f46e5,#06b6d4);
padding:15px;text-align:center;color:white;font-weight:bold;position: relative;
}

.btn-logout {
position: absolute; right: 15px; top: 12px; background: #ef4444; padding: 6px 12px; 
border-radius: 8px; font-size: 12px; cursor: pointer; border: none; color: white; font-weight: bold;
}

.container{display:flex;flex-direction:column;height:100vh;}
.content{flex:1;padding:20px;overflow:auto; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box;}

.card{
background:var(--card);
padding:15px;border-radius:15px;margin-bottom:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

input,select{
width:100%;padding:10px;margin:5px 0;border-radius:10px;
border:none;background:#020617;color:white;box-sizing: border-box;
}
input::placeholder { color: #64748b; }

button{
width:100%;padding:10px;margin-top:5px;border:none;
border-radius:10px;background:linear-gradient(90deg,#4f46e5,#06b6d4);
color:white;cursor:pointer;font-weight: bold;
}
button:hover{ opacity: 0.9; }

.menu{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}

.menu div{
background:var(--card);padding:20px;text-align:center;
border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);font-weight: bold;
}
.menu div:hover{ background: #24334d; }

.struk{
background:white;color:black;padding:15px;border-radius:10px;margin-top:10px;
font-family:monospace;
}

.line{border-bottom:1px dashed #aaa;margin:8px 0;}

.status{padding:4px;border-radius:5px;color:white;font-size:12px;}
.sukses{background:green; padding: 2px 6px; border-radius: 4px;}
.pending{background:orange; padding: 2px 6px; border-radius: 4px;}
.proses{background:blue; padding: 2px 6px; border-radius: 4px;}
.gagal{background:red; padding: 2px 6px; border-radius: 4px;}

.link-register { display: block; text-align: center; margin-top: 15px; color: #22d3ee; text-decoration: none; font-size: 14px; }
</style>
</head>

<body>

<div class="container">
<div class="header">
    K7N STORE
    <button id="logoutBtn" class="btn-logout" onclick="logout()" style="display:none;">Keluar</button>
</div>
<div class="content" id="app"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const app = document.getElementById("app");

// Pengambilan data lokal terlindungi
let db = JSON.parse(localStorage.getItem("k7n_transaksi")) || [];
let users = JSON.parse(localStorage.getItem("k7n_users")) || [];
let currentAdmin = localStorage.getItem("k7n_session") || null;

// Membuat 1 akun admin default otomatis jika k7n_users masih kosong di browser
if (users.length === 0) {
    users = [{ username: "admin", password: "123" }];
    localStorage.setItem("k7n_users", JSON.stringify(users));
}

// Menyesuaikan preferensi tema kustom yang tersimpan sebelumnya
let savedTema = localStorage.getItem("tema");
let savedBg = localStorage.getItem("bg");
if(savedTema) document.documentElement.style.setProperty('--tema', savedTema);
if(savedBg) document.documentElement.style.setProperty('--bg', savedBg);

const WEBHOOK_STRUK = "https://discord.com";

const produk = [
{nama:"Follower Indo 100",harga:10500},
{nama:"Follower Global 100",harga:5000},
{nama:"Like TikTok 100",harga:800},
{nama:"Viewer 1000",harga:800}
];

function save(){
    localStorage.setItem("k7n_transaksi", JSON.stringify(db));
}

/* ================= DISCORD STRUK INTERACTION ================= */
async function sendStruk(x) {
    try {
        await fetch(WEBHOOK_STRUK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                embeds: [{
                    title: "🧾 STRUK TRANSAKSI K7N STORE",
                    color: 5763719,
                    fields: [
                        { name: "ID Transaksi", value: x.id, inline: true },
                        { name: "Nama Pelanggan", value: x.nama, inline: true },
                        { name: "Produk", value: x.produk, inline: true },
                        { name: "Harga", value: "Rp " + Number(x.harga).toLocaleString("id-ID"), inline: true },
                        { name: "Status", value: x.status, inline: true },
                        { name: "Admin", value: "admin:" + x.admin, inline: false },
                        { name: "Waktu", value: new Date(x.tanggal).toLocaleString("id-ID"), inline: false }
                    ],
                    footer: { text: "K7N STORE SYSTEM" }
                }]
            })
        });
    } catch (e) {
        console.error("Gagal mengirim struk ke Discord", e);
    }
}

/* ================= SISTEM AUTHENTICATION GERBANG ================= */
function checkAuth() {
    if (!currentAdmin) {
        showLogin();
        document.getElementById("logoutBtn").style.display = "none";
    } else {
        page("dashboard");
        document.getElementById("logoutBtn").style.display = "block";
    }
}

function showLogin() {
    app.innerHTML = `
        <div class="card">
            <h3 style="text-align:center; margin-top:0;">LOGIN ADMIN</h3>
            <input type="text" id="loginUser" placeholder="Username / Nama Akun">
            <input type="password" id="loginPass" placeholder="Kata Sandi">
            <button onclick="prosesLogin()">Masuk</button>
            <a href="https://github.io" target="_blank" class="link-register">Belum punya akun? Buat di sini</a>
        </div>
    `;
}

window.prosesLogin = function() {
    const userIn = document.getElementById("loginUser").value.trim();
    const passIn = document.getElementById("loginPass").value;

    if(!userIn || !passIn) {
        alert("Semua kolom harus diisi!");
        return;
    }

    let currentUsers = JSON.parse(localStorage.getItem("k7n_users")) || users;
    let userValid = currentUsers.find(u => u.username.toLowerCase() === userIn.toLowerCase() && u.password === passIn);

    if (userValid) {
        currentAdmin = userValid.username;
        localStorage.setItem("k7n_session", currentAdmin);
        checkAuth();
    } else {
        alert("Akun tidak ditemukan atau sandi salah!");
    }
}

window.logout = function() {
    localStorage.removeItem("k7n_session");
    currentAdmin = null;
    checkAuth();
}

/* ================= ROUTER HALAMAN WEB KASIR ================= */
function page(p){
if(!currentAdmin) return showLogin();

if(p=="dashboard"){
    let total=0;
    db.forEach(x=>{if(x.status=="SUKSES") total+=Number(x.harga)});

    app.innerHTML=`
    <div class="card">
    <h3>Dashboard Admin: ${currentAdmin}</h3>
    <p>💰 Rp ${total.toLocaleString("id-ID")}</p>
    <p>📦 ${db.length} Transaksi</p>
    </div>

    <div class="menu">
    <div onclick="page('buat')">📦 Buat</div>
    <div onclick="page('riwayat')">📊 Riwayat</div>
    <div onclick="page('setting')">⚙️ Setting</div>
    </div>
    `;
}

/* HALAMAN BUAT STRUK */
if(p=="buat"){
    let opt=produk.map((x,i)=>`<option value="${i}">${x.nama}</option>`).join("");

    app.innerHTML=`
    <div class="card">
    <button onclick="page('dashboard')">⬅️ Kembali</button>

    <h3>Buat Struk</h3>
    <input id="nama" placeholder="Nama Pelanggan">

    <select id="produkSel" onchange="autoHarga()">
    <option value="">Pilih Produk</option>
    ${opt}
    <option value="custom">Custom</option>
    </select>

    <input id="harga" type="number" placeholder="Harga">

    <select id="status">
    <option>SUKSES</option>
    <option>PENDING</option>
    <option>PROSES</option>
    <option>GAGAL</option>
    </select>

    <button onclick="buat()">Buat & Kirim</button>
    <div id="hasil"></div>
    </div>
    `;
}

/* HALAMAN RIWAYAT */
if(p=="riwayat"){
    let html=`<button onclick="page('dashboard')" style="margin-bottom:10px;">⬅️ Kembali</button>`;
    if(db.length === 0){
        html += `<div class="card"><p style="text-align:center;">Belum ada riwayat transaksi.</p></div>`;
    }
    db.slice().reverse().forEach((x,i)=>{
        let indexAsli = db.length - 1 - i;
        html+=`
        <div class="card">
        <b>${x.id}</b> — <span style="font-size:12px; color:#64748b;">Admin: ${x.admin || 'System'}</span><br>
        Pelanggan: ${x.nama}<br>
        Produk: ${x.produk}<br>
        Rp ${Number(x.harga).toLocaleString("id-ID")}<br>
        Status: <span class="status ${x.status.toLowerCase()}">${x.status}</span>
        <button onclick="edit(${indexAsli})" style="width:48%; display:inline-block; margin-top:10px;">Edit</button>
        <button onclick="hapus(${indexAsli})" style="width:48%; display:inline-block; margin-top:10px; background:red;">Hapus</button>
        </div>`;
    });
    app.innerHTML=html;
}

/* HALAMAN SETTING TEMA */
if(p=="setting"){
    let tema=localStorage.getItem("tema")||"#4f46e5";
    let bg=localStorage.getItem("bg")||"#0f172a";

    app.innerHTML=`
    <div class="card">
    <button onclick="page('dashboard')">⬅️ Kembali</button>

    <h3>Setting</h3>

    <label>Tema Panel</label>
    <input type="color" id="color" value="${tema}">

    <label>Background Utama</label>
    <input type="color" id="bgcolor" value="${bg}">

    <button onclick="saveTheme()">Simpan Perubahan</button>
    </div>
    `;
}
}

/* AUTO HARGA ACTION */
window.autoHarga=function(){
    let v=document.getElementById("produkSel").value;
    if(v!=="custom" && v!==""){
